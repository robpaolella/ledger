<style>/* Prototype-only chrome and the few pieces this design proposes. Colours are tokens. */
#proto-bar {
  position: relative; z-index: 100; min-height: 48px;
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; padding: 8px 12px;
  background: repeating-linear-gradient(135deg, var(--surface-2) 0 10px, var(--surface) 10px 20px);
  border-bottom: 2px dashed var(--warning); font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 11px; color: var(--text-2);
}
#proto-bar .tag { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--warning); white-space: nowrap; }
#proto-bar .ver { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
#proto-bar label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
#proto-bar select { height: 32px; border-radius: 8px; border: 1px dashed var(--warning); background: var(--surface); color: var(--text); font: inherit; font-size: 12px; padding: 0 6px; }
#proto-bar select:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
@media (max-width: 767px) {
  #proto-bar .ver, #proto-bar .lbl { display: none; }
  #proto-bar label:first-of-type { flex: 1; min-width: 0; }
  #proto-bar label:first-of-type select { width: 100%; }
}
#proto-toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 200;
  max-width: calc(100vw - 32px); padding: 10px 14px; border-radius: 10px;
  background: var(--elevated); border: 2px dashed var(--warning); box-shadow: var(--shadow-md);
  font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: var(--text);
}

/* The frozen app shell scrolls as one page here, so full-page captures show everything. */
#root { position: relative; }
#root .app-shell-height { height: auto; min-height: calc(100dvh - 50px); }
#root aside.fixed { position: absolute; top: 0; bottom: 0; height: auto; }
#root .overflow-y-auto.flex-1 { overflow-x: clip; overflow-y: visible; min-width: 0; }
#root .sticky { position: relative; top: auto; }

a:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

/* New for this design: the striped grey that marks "Uncategorized" (Robert, decision 7). */
.unc-hatch {
  background:
    repeating-linear-gradient(135deg, var(--text-3) 0 2px, transparent 2px 5px),
    color-mix(in srgb, var(--text-3) 14%, var(--surface));
}
.unc-hatch-bar {
  background:
    repeating-linear-gradient(135deg, var(--text-3) 0 3px, transparent 3px 7px),
    color-mix(in srgb, var(--text-3) 30%, var(--surface));
}
.unc-row { cursor: pointer; }
.unc-row:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
.unc-phone-only { display: none; }
.unc-row:hover { background: var(--surface-2); }
.unc-link { color: var(--warning); font-weight: 700; text-decoration: none; white-space: nowrap; }
.unc-link:hover { text-decoration: underline; }
@media (max-width: 767px) {
  .unc-notice-action { flex-basis: 100%; padding-left: 25px; margin: -8px 0 -12px; }
  .unc-notice-action a { display: inline-flex; align-items: center; min-height: 44px; }
  .unc-note { display: block; min-height: 44px; padding: 12px 0; margin-top: -12px !important; margin-bottom: -10px; }
  .unc-phone-only { display: inline; }
}
</style>
</head><body>

<script>const VERSION = 'b';
const SUN_ICON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
/* Uncategorized in totals prototype (#106). Synthetic sample data only.
   The pages are frozen snapshots of the real Budget, Reports and Dashboard on the seeded
   sample household (October 2026). This script adds the uncategorized money to them.
   Version A: an "Uncategorized" row at the end of each section's list.
   Version B: one notice above the lists; the lists themselves stay categories only.
   Both: totals include the money, Reports charts get a striped grey slice and a dashed
   grey line, and the Dashboard Spending card gets an "Includes … uncategorized" line. */

const STATES = {
  'budget':          { surface: 'budget',    data: 'typical', label: 'Budget · typical' },
  'budget-large':    { surface: 'budget',    data: 'large',   label: 'Budget · large' },
  'budget-none':     { surface: 'budget',    data: null,      label: 'Budget · nothing uncategorized' },
  'reports':         { surface: 'reports',   data: 'typical', label: 'Reports · Breakdown + Summary' },
  'reports-trends':  { surface: 'trends',    data: 'typical', label: 'Reports · Trends + Timeline' },
  'reports-trends-large': { surface: 'trends', data: 'large',  label: 'Reports · Trends, large' },
  'reports-large':   { surface: 'reports',   data: 'large',   label: 'Reports · large' },
  'reports-none':    { surface: 'reports',   data: null,      label: 'Reports · nothing uncategorized' },
  'dashboard':       { surface: 'dashboard', data: 'typical', label: 'Dashboard · Spending card' },
  'dashboard-none':  { surface: 'dashboard', data: null,      label: 'Dashboard · nothing uncategorized' },
};
const THEMES = ['light', 'dark'];
// All of it landed this month (a recent bank sync), so month and year-to-date agree.
const DATA = {
  typical: { out: 412.37, outN: 6, inn: 85.00, inN: 1 },
  large:   { out: 3906.18, outN: 48, inn: 1240.00, inN: 3 },
};
const VERSION_NOTE = {
  a: 'Version A · a row at the end of each list',
  b: 'Version B · one notice above the lists',
};

const params = new URLSearchParams(location.search);
let state = STATES[params.get('state')] ? params.get('state') : 'budget';
let theme = THEMES.includes(params.get('theme')) ? params.get('theme') : 'light';

// ---------- formatting (mirrors formatMoney: whole dollars, money in is green +$X) ----------
const whole = (n) => '$' + Math.round(Math.abs(n)).toLocaleString('en-US');
const cents = (n) => '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const total = (n) => (Math.round(n) < 0 ? '-' : '') + whole(n);
const num = (t) => Number(String(t).replace(/[^0-9.-]/g, '')) || 0;
const txns = (n) => `${n.toLocaleString('en-US')} transaction${n === 1 ? '' : 's'}`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const chev = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:inline;vertical-align:-2px"><path d="m9 6 6 6-6 6"/></svg>';
const warnIcon = '<svg class="shrink-0" style="margin-top:1px" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';
const pctText = (p) => (p > 0 && p < 0.005 ? '<1%' : `${Math.round(p * 100)}%`);
const swatch = (size, radius) => `<span class="unc-hatch" aria-hidden="true" style="flex:none;display:inline-block;width:${size}px;height:${size}px;border-radius:${radius}px;border:1px solid var(--line-strong)"></span>`;

const $all = (root, sel) => Array.from(root.querySelectorAll(sel));
const byText = (root, sel, text) => $all(root, sel).filter((el) => el.textContent.trim() === text);
const html = (s) => { const t = document.createElement('template'); t.innerHTML = s.trim(); return t.content.firstElementChild; };

// A click-through to Review. In the prototype it explains where it goes.
const review = (period, n) => `data-review="${esc(period)}" data-count="${n}"`;

// ---------- the uncategorized pieces ----------
function notice(d, period, extra = '') {
  const parts = [`${whole(d.out)} out`];
  if (d.inN) parts.push(`+${whole(d.inn)} in`); // plain text: InlineNotification's message is a string
  const n = d.outN + d.inN;
  return html(`<div role="status" class="flex items-start gap-2.5 flex-wrap rounded-[12px] border px-4 py-3 text-[13px] font-medium leading-snug ${extra}"
      style="background: color-mix(in srgb, var(--warning) 12%, var(--surface)); border-color: color-mix(in srgb, var(--warning) 35%, transparent); color: var(--warning);">
    ${warnIcon}
    <span class="flex-1" style="min-width:160px"><b>${txns(n)} ${n === 1 ? 'has' : 'have'} no category yet</b> (${parts.join(', ')}). They're counted in the totals below.</span>
    <span class="ml-auto unc-notice-action"><a href="#review" ${review(period, n)} class="unc-link" style="color:var(--warning)">Review them ${chev}</a></span>
  </div>`);
}

// Rail and Dashboard Budget card: "$3,255 earned" / "$2,978 spent" blocks.
function updateEarnedSpent(root, d) {
  for (const el of $all(root, 'span')) {
    if (el.children.length) continue;
    const m = el.textContent.trim().match(/^\$([\d,]+) (earned|spent)$/);
    if (!m) continue;
    const add = m[2] === 'earned' ? d.inn : d.out;
    const row = el.closest('.flex.items-center.justify-between');
    const block = row.parentElement;
    const plannedEl = $all(block, 'span').find((x) => / planned$/.test(x.textContent.trim()));
    const planned = num(plannedEl && plannedEl.textContent);
    const actual = num(m[1]) + add;
    el.textContent = `${whole(actual)} ${m[2]}`;
    const bar = block.querySelector('.h-full.rounded-full');
    if (bar && planned > 0) bar.style.width = Math.min(100, actual / planned * 100) + '%';
    const remNum = Array.from(row.children).find((c) => c !== el && / remaining$/.test(c.textContent.trim()))?.querySelector('span');
    if (remNum) remNum.textContent = whole(planned - actual);
  }
}

// ---------- Budget ----------
function budgetDesktop(root, d) {
  const period = 'October 2026';
  const headers = $all(root, 'div.bg-surface-2.uppercase');
  for (const h of headers) {
    const label = h.children[0].textContent.trim();
    if (label !== 'Income' && label !== 'Expenses') continue;
    const income = label === 'Income';
    const add = income ? d.inn : d.out, n = income ? d.inN : d.outN;
    if (!n) continue;
    const planned = num(h.children[1].textContent);
    const actual = num(h.children[2].textContent) + add;
    h.children[2].textContent = whole(actual);
    const rem = planned - actual, remEl = h.children[3];
    remEl.classList.remove('text-positive', 'text-negative');
    if (income && rem < 0) { remEl.textContent = `+${whole(-rem)} over plan`; remEl.classList.add('text-positive'); }
    else { remEl.textContent = total(rem); remEl.classList.add(rem < 0 ? 'text-negative' : 'text-positive'); }
    if (VERSION === 'a') {
      h.parentElement.appendChild(html(`<div class="unc-row grid gap-3 px-6 border-b border-line items-center" role="link" tabindex="0" ${review(period, n)}
          style="grid-template-columns: minmax(0,1fr) 82px 82px 144px; padding-top:14px; padding-bottom:14px">
        <div class="flex items-center min-w-0" style="gap:10px">
          <span style="flex:none;width:28px;height:28px;margin:-4px"></span>
          ${swatch(28, 8)}
          <span class="font-bold text-[15px] text-content-2 truncate">Uncategorized</span>
          <span class="text-[13px] text-content-3 whitespace-nowrap">${txns(n)}</span>
        </div>
        <span class="text-right text-[15px] text-content-3">—</span>
        <span class="text-right text-[15px] text-content-2 tabular-nums">${whole(add)}</span>
        <span class="text-right text-sm unc-link">${n.toLocaleString('en-US')} to review ${chev}</span>
      </div>`));
    }
  }
  updateEarnedSpent(root, d);
  if (VERSION === 'b') {
    const grid = root.querySelector('[class*="316px"]');
    grid.parentElement.insertBefore(notice(d, period, 'mb-5'), grid);
  }
}

function budgetPhone(root, d) {
  const period = 'October 2026';
  if (VERSION === 'b') {
    const band = byText(root, 'span', 'Left to budget')[0].parentElement;
    band.after(notice(d, period, 'mb-5'));
    return;
  }
  for (const title of $all(root, 'span.text-\\[17px\\].font-bold')) {
    const label = title.textContent.trim();
    if (label !== 'Income' && label !== 'Expenses') continue;
    const income = label === 'Income';
    const add = income ? d.inn : d.out, n = income ? d.inN : d.outN;
    if (!n) continue;
    const list = title.closest('.mb-6').querySelector('.flex.flex-col.gap-3');
    list.appendChild(html(`<div class="unc-row bg-surface border border-line rounded-card shadow-sm overflow-hidden" role="link" tabindex="0" ${review(period, n)}>
      <div class="flex items-center gap-2 px-3 py-3" style="min-height:56px">
        <span style="flex:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center">${swatch(28, 8)}</span>
        <span class="flex-1 min-w-0">
          <span class="block font-bold text-[15px] text-content-2 truncate">Uncategorized</span>
          <span class="block text-[13px] text-content-3 tabular-nums truncate">${whole(add)} · ${txns(n)}</span>
        </span>
        <span class="h-9 rounded-[10px] inline-flex items-center justify-center gap-1 text-[14px] font-bold" style="width:82px;flex:none;background: color-mix(in srgb, var(--warning) 14%, transparent); color: var(--warning);">Review</span>
      </div>
    </div>`));
  }
}

// ---------- Reports ----------
const PERIOD_YTD = 'year to date';
function reportsKpis(root, d) {
  const card = (label) => byText(root, 'div.font-mono', label)[0];
  const inc = card('Income'), exp = card('Expenses'), net = card('Net'), rate = card('Savings rate');
  const incV = num(inc.nextElementSibling.textContent) + d.inn;
  const expBase = num(exp.nextElementSibling.textContent);
  const months = Math.max(1, Math.round(expBase / num(exp.nextElementSibling.nextElementSibling.textContent)));
  const expV = expBase + d.out, netV = incV - expV;
  inc.nextElementSibling.textContent = whole(incV);
  exp.nextElementSibling.textContent = whole(expV);
  exp.nextElementSibling.nextElementSibling.textContent = `${whole(expV / months)} avg / mo`;
  net.nextElementSibling.textContent = total(netV);
  rate.nextElementSibling.textContent = `${Math.round(netV / incV * 100)}%`;
  rate.nextElementSibling.nextElementSibling.textContent = `${total(netV / months)} avg / mo`;
  return { incV, expV, netV };
}

function reportsFlow(root, d, k) {
  const legend = root.querySelector('.flex.flex-wrap.gap-y-3\\.5');
  const bar = root.querySelector('[style*="height: 22px"]');
  if (!legend || !bar) return;
  const items = Array.from(legend.children);
  const segs = Array.from(bar.children);
  const denom = k.netV > 0 ? k.incV : k.expV;
  for (const el of $all(root, 'span.text-content-3')) {
    if (/^Income \$[\d,]+ · /.test(el.textContent.trim())) el.textContent = el.textContent.replace(/\$[\d,]+/, whole(k.incV));
  }
  const rows = items.map((it, i) => {
    const name = it.children[1].textContent.trim();
    const amount = name === 'Saved' ? Math.max(0, k.netV) : num(it.children[2].textContent.split('·')[0]);
    return { it, seg: segs[i], amount };
  });
  // Uncategorized goes last, striped, after "Other".
  const segU = segs[0].cloneNode(true);
  segU.style.background = ''; segU.className = 'relative unc-hatch-bar';
  bar.appendChild(segU);
  const itU = html(`<div class="flex items-center gap-2 text-[13px]">
      ${swatch(14, 4)}<span class="font-semibold">Uncategorized</span><span class="text-content-3 tabular-nums"></span></div>`);
  legend.appendChild(itU);
  rows.push({ it: itU, seg: segU, amount: d.out });
  rows.forEach((r, i) => {
    const pct = r.amount / denom;
    r.it.children[2].textContent = `${whole(r.amount)} · ${(pct * 100).toFixed(1)}%`;
    Object.assign(r.seg.style, { width: '', flex: `${pct} 1 0px`, minWidth: '3px', borderRadius: i === 0 ? '6px 0 0 6px' : i === rows.length - 1 ? '0 6px 6px 0' : '0' });
  });
}

function reportsSummary(root, d) {
  for (const h of $all(root, 'div.bg-surface-2[style*="12px 26px"]')) {
    const labelEl = h.querySelector('span.uppercase');
    const label = labelEl && labelEl.textContent.trim();
    if (label !== 'Income' && label !== 'Expenses') continue;
    const income = label === 'Income';
    const add = income ? d.inn : d.out, n = income ? d.inN : d.outN;
    if (!n) continue;
    const totEl = h.lastElementChild;
    const newTotal = num(totEl.textContent) + add;
    totEl.textContent = whole(newTotal);
    const sec = h.parentElement;
    for (const row of $all(sec, ':scope > div > div.border-b')) {
      const amt = row.querySelector('.w-24'), pct = row.querySelector('.w-14'), fill = row.querySelector('.flex-1 > .h-full');
      if (!amt || !pct) continue;
      const p = num(amt.textContent) / newTotal;
      pct.textContent = `${Math.round(p * 100)}%`;
      if (fill) fill.style.width = (p * 100).toFixed(1) + '%';
    }
    if (VERSION === 'a') {
      const p = add / newTotal;
      sec.appendChild(html(`<div><div class="unc-row flex items-center gap-3 border-b border-line" role="link" tabindex="0" ${review(PERIOD_YTD, n)} style="padding: 15px 26px;">
        <span class="shrink-0" style="width:24px;margin-left:-4px"></span>
        ${swatch(14, 4)}
        <span class="shrink-0 min-w-0" style="width:172px"><span class="block font-semibold text-[15px] text-content-2 truncate">Uncategorized</span><span class="block text-[12px] unc-link"><span class="unc-phone-only">${whole(add)} · </span>${n.toLocaleString('en-US')} to review</span></span>
        <div class="flex-1 h-2 rounded-full bg-surface-2 overflow-hidden"><div class="h-full rounded-full unc-hatch-bar" style="width: ${(p * 100).toFixed(1)}%;"></div></div>
        <span class="w-14 shrink-0 text-right text-[13px] text-content-3 tabular-nums">${pctText(p)}</span>
        <span class="w-24 shrink-0 text-right font-bold text-[15px] tabular-nums text-content-2">${whole(add)}</span>
        <span class="shrink-0" style="color:var(--warning);width:16px">${chev}</span>
      </div></div>`));
    }
  }
}

function reportsTimeline(root, d) {
  for (const h of $all(root, 'div.bg-surface-2[style*="11px 26px"]')) {
    const labelEl = h.querySelector('span.uppercase');
    const label = labelEl && labelEl.textContent.trim();
    if (label !== 'Income' && label !== 'Expenses') continue;
    const income = label === 'Income';
    const add = income ? d.inn : d.out, n = income ? d.inN : d.outN;
    if (!n) continue;
    const cells = Array.from(h.children).slice(1);
    const last = cells[cells.length - 2], tot = cells[cells.length - 1];
    last.textContent = whole(num(last.textContent) + add);
    tot.textContent = whole(num(tot.textContent) + add);
    if (VERSION === 'a') {
      const minW = cells[0].style.minWidth;
      const monthCells = cells.slice(0, -1).map((_, i, arr) => {
        const v = i === arr.length - 1 ? add : 0;
        return `<span class="text-right text-sm tabular-nums" style="flex:1 1 0px;min-width:${minW};color:${v ? 'var(--text)' : 'var(--text-3)'};font-weight:${v ? 700 : 500}">${v ? whole(v) : '$0'}</span>`;
      }).join('');
      h.parentElement.appendChild(html(`<div><div class="unc-row flex items-center border-b border-line" role="link" tabindex="0" ${review(PERIOD_YTD, n)} style="padding: 13px 26px;">
        <span class="shrink-0 flex items-center gap-2 min-w-0" style="width:214px"><span class="shrink-0" style="width:20px"></span>${swatch(14, 4)}<span class="font-semibold text-sm text-content-2 truncate">Uncategorized</span><span class="text-[12px] unc-link">${n.toLocaleString('en-US')} to review</span></span>
        ${monthCells}
        <span class="shrink-0 text-right font-bold text-sm tabular-nums" style="width:104px">${whole(add)}</span>
      </div></div>`));
    }
  }
}

function reportsTrends(root, d) {
  const svg = root.querySelector('svg[viewBox="0 0 1200 380"]');
  if (!svg) return;
  const PY1 = 336, PH = 312;
  const lines = $all(svg, 'polyline');
  const totalLine = lines.find((p) => p.getAttribute('stroke') === 'var(--text)');
  const chips = root.querySelector('.mt-4.border-t.border-line.pt-4');
  const totalChip = chips.children[0];
  const baseTotal = num(totalChip.lastElementChild.textContent);
  const pts = (p) => p.getAttribute('points').trim().split(/\s+/).map((s) => s.split(',').map(Number));
  const tp = pts(totalLine);
  const vOld = baseTotal * PH / (PY1 - tp[tp.length - 1][1]);
  const n = tp.length;
  const unc = tp.map((_, i) => (i === n - 1 ? d.out : 0));
  const newMax = baseTotal + d.out;
  const vNew = Math.max(vOld, newMax * 1.06);
  const toV = (y) => (PY1 - y) / PH * vOld;
  const toY = (v) => (PY1 - v / vNew * PH).toFixed(1);
  for (const p of lines) {
    const isTotal = p.getAttribute('points') === totalLine.getAttribute('points');
    p.setAttribute('points', pts(p).map(([x, y], i) => `${x.toFixed(1)},${toY(toV(y) + (isTotal ? unc[i] : 0))}`).join(' '));
  }
  // Rescale the axis labels if the top moved.
  const labels = $all(svg.parentElement, ':scope > div.absolute').filter((el) => /^\$[\d.]+k?$/.test(el.textContent.trim()) && el.style.top.endsWith('%') && el.style.left === '0px');
  labels.forEach((el) => {
    const y = parseFloat(el.style.top) / 100 * 380;
    const v = (PY1 - y) / PH * vNew;
    el.textContent = v < 1 ? '$0' : `$${Math.round(v / 1000)}k`;
  });
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
  g.setAttribute('points', tp.map(([x], i) => `${x.toFixed(1)},${toY(unc.slice(0, i + 1).reduce((a, b) => a + b, 0))}`).join(' '));
  Object.entries({ fill: 'none', stroke: 'var(--text-3)', 'stroke-width': '2.5', 'stroke-dasharray': '7 6', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }).forEach(([k, v]) => g.setAttribute(k, v));
  svg.insertBefore(g, totalLine);
  totalChip.lastElementChild.textContent = whole(newMax);
  const chip = html(`<div class="inline-flex items-center gap-2 h-[34px] px-3 rounded-full cursor-pointer" style="border: 1px dashed var(--line-strong); background: var(--surface-2)">
      ${swatch(10, 3)}<span class="text-[13px]" style="font-weight:600">Uncategorized</span><span class="text-[13px] font-bold text-content-3 tabular-nums">${whole(d.out)}</span></div>`);
  const more = Array.from(chips.children).find((c) => c.tagName === 'BUTTON');
  chips.insertBefore(chip, more || null);
}

function reports(root, d, trends) {
  const k = reportsKpis(root, d);
  if (trends) { reportsTrends(root, d); reportsTimeline(root, d); }
  else { reportsFlow(root, d, k); reportsSummary(root, d); }
  if (VERSION === 'b') {
    const kpiRow = root.querySelector('.grid.grid-cols-2');
    kpiRow.after(notice(d, PERIOD_YTD, 'mb-[22px]'));
  }
}

// ---------- Dashboard ----------
function dashboard(root, d) {
  updateEarnedSpent(root, d);
  const head = byText(root, 'span', 'Spending')[0];
  if (!head) return;
  const amount = head.nextElementSibling.querySelector('span');
  amount.textContent = cents(num(amount.textContent) + d.out);
  const header = head.parentElement.parentElement;
  // This month's line grows by the same share as the headline (spread across the month).
  const line = $all(header.parentElement, 'polyline').find((p) => p.getAttribute('stroke') === 'var(--primary)');
  if (line) {
    const svg = line.ownerSVGElement, BASE = 216, k = num(amount.textContent) / (num(amount.textContent) - d.out);
    const up = (y) => (BASE - (BASE - y) * k).toFixed(1);
    const fix = (el) => el.setAttribute('points', el.getAttribute('points').trim().split(/\s+/).map((pt) => { const [x, y] = pt.split(','); return `${x},${Number(y) === BASE ? y : up(Number(y))}`; }).join(' '));
    fix(line); svg.querySelectorAll('polygon').forEach(fix);
    const dot = svg.querySelector('circle[fill="var(--primary)"]');
    if (dot) dot.setAttribute('cy', up(Number(dot.getAttribute('cy'))));
  }
  header.appendChild(html(`<a href="#review" ${review('October 2026', d.outN)} class="unc-note text-[13px] font-medium text-content-3" style="flex-basis:100%;margin-top:-6px;text-decoration:none">
    Includes <span class="tabular-nums">${whole(d.out)}</span> uncategorized · <span class="unc-link" style="color:var(--primary)">Review</span></a>`));
}

// ---------- shell ----------
const root = document.getElementById('root');
const phoneMq = matchMedia('(max-width: 767px)');

function render() {
  const s = STATES[state];
  const phone = phoneMq.matches;
  root.innerHTML = document.getElementById(`t-${s.surface}-${phone ? '390' : '1440'}`).innerHTML;
  document.documentElement.classList.toggle('dark', theme === 'dark');
  const tbtn = root.querySelector('button[title="Dark mode"]');
  if (tbtn && theme === 'dark') { tbtn.title = 'Light mode'; tbtn.innerHTML = SUN_ICON; }
  const d = s.data ? DATA[s.data] : null;
  if (d) {
    if (s.surface === 'budget') (phone ? budgetPhone : budgetDesktop)(root, d);
    else if (s.surface === 'reports') reports(root, d, false);
    else if (s.surface === 'trends') reports(root, d, true);
    else dashboard(root, d);
  }
  if (s.surface === 'dashboard' && phone && params.get('scroll') !== 'top') {
    const card = byText(root, 'span', 'Spending')[0];
    if (card) card.scrollIntoView({ block: 'start' });
  }
  renderBar();
  document.documentElement.dataset.state = state;
  document.documentElement.dataset.theme = theme;
}

function renderBar() {
  const bar = document.getElementById('proto-bar');
  const focused = document.activeElement && bar.contains(document.activeElement) ? document.activeElement.id : null;
  bar.innerHTML = `<span class="tag">Prototype</span>
    <span class="ver">${VERSION_NOTE[VERSION]} · sample data</span>
    <label><span class="lbl">State</span><select id="ps" aria-label="Prototype state">${Object.entries(STATES).map(([k, v]) => `<option value="${k}"${k === state ? ' selected' : ''}>${v.label}</option>`).join('')}</select></label>
    <label><span class="lbl">Theme</span><select id="pt" aria-label="Prototype theme">${THEMES.map((t) => `<option${t === theme ? ' selected' : ''}>${t}</option>`).join('')}</select></label>`;
  bar.querySelector('#ps').onchange = (e) => { state = e.target.value; sync(); };
  bar.querySelector('#pt').onchange = (e) => { theme = e.target.value; sync(); };
  if (focused) bar.querySelector('#' + focused).focus(); // keep keyboard place after a change
}

function sync() {
  params.set('state', state); params.set('theme', theme);
  history.replaceState(null, '', '?' + params.toString());
  render();
}

let toastTimer;
function toast(msg) {
  let t = document.getElementById('proto-toast');
  if (!t) { t = document.createElement('div'); t.id = 'proto-toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 4000);
}

function activate(e) {
  const rv = e.target.closest('[data-review]');
  if (rv) {
    e.preventDefault();
    const n = Number(rv.dataset.count);
    toast(`Prototype: opens Review, showing the ${txns(n)} with no category from ${rv.dataset.review}.`);
    return;
  }
  const tb = e.target.closest('button[title="Dark mode"], button[title="Light mode"]');
  if (tb) { theme = theme === 'dark' ? 'light' : 'dark'; sync(); return; }
  if (e.target.closest('a, button')) e.preventDefault(); // the rest of the frozen page is inert
}
root.addEventListener('click', activate);
root.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="link"][data-review]')) activate(e); });
phoneMq.addEventListener('change', render);
render();
</script>
