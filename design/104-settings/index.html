<style>/* Prototype-only chrome and the few new pieces this design proposes. Colours are tokens. */
:root { --proto-bar: 48px; }
.proto-shell { min-height: calc(100dvh - var(--proto-bar)); }
#proto-bar {
  position: sticky; top: 0; z-index: 100; height: var(--proto-bar);
  display: flex; align-items: center; gap: 10px; padding: 0 12px;
  background: repeating-linear-gradient(135deg, var(--surface-2) 0 10px, var(--surface) 10px 20px);
  border-bottom: 2px dashed var(--warning); font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 11px; color: var(--text-2);
}
#proto-bar .tag { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--warning); white-space: nowrap; }
#proto-bar .ver { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#proto-bar label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
#proto-bar select { height: 32px; border-radius: 8px; border: 1px dashed var(--warning); background: var(--surface); color: var(--text); font: inherit; font-size: 12px; padding: 0 6px; }
#proto-bar select:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
#proto-bar .spacer { flex: 1; }
@media (max-width: 767px) {
  #proto-bar { gap: 6px; padding: 0 8px; }
  #proto-bar .ver, #proto-bar .lbl { display: none; }
  #proto-bar label:first-of-type { flex: 1; min-width: 0; }
  #proto-bar label:first-of-type select { width: 100%; }
}

button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--ring); outline-offset: 2px;
}

/* Access preset choice: radio rows (new element for Robert to approve). */
.preset { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }
.preset:hover { border-color: var(--line-strong); }
.preset[aria-checked="true"] { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 9%, var(--surface)); }
.preset .dot { width: 19px; height: 19px; flex: none; margin-top: 1px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: var(--surface); display: flex; align-items: center; justify-content: center; }
.preset[aria-checked="true"] .dot { border-color: var(--primary); }
.preset[aria-checked="true"] .dot::after { content: ''; width: 9px; height: 9px; border-radius: 999px; background: var(--primary); }
.preset[aria-disabled="true"] { cursor: default; }

/* Desktop side panel for a person (version B). */
.side-scrim { position: fixed; inset: var(--proto-bar) 0 0 0; z-index: 90; background: var(--bg-modal); }
.side-panel { position: fixed; top: var(--proto-bar); right: 0; bottom: 0; z-index: 91; width: 480px; max-width: 100vw; background: var(--elevated); border-left: 1px solid var(--line); box-shadow: var(--shadow-md); display: flex; flex-direction: column; }
.side-panel .body, .sheet .body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
.side-panel .body::-webkit-scrollbar, .sheet .body::-webkit-scrollbar { display: none; }

/* Phone bottom sheet (same look as BottomSheet.tsx). */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 91; max-height: 92dvh; background: var(--elevated); border-radius: 20px 20px 0 0; box-shadow: var(--shadow-md); display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }

.skeleton { background: var(--surface-2); border-radius: 8px; }
.row-btn { width: 100%; text-align: left; background: transparent; border: 0; cursor: pointer; }
.row-btn:hover { background: var(--surface-2); }
.tabular { font-variant-numeric: tabular-nums; }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
html.proto-locked, html.proto-locked body { height: 100%; overflow: hidden; }
html.proto-locked #root { height: calc(100dvh - var(--proto-bar)); overflow: hidden; }
@media (max-width: 767px) { .tap { min-height: 44px; } .rule-title, .rule-sub { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; overflow-wrap: anywhere; } }
@media (min-width: 768px) { .rule-title, .rule-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } }
/* Phones: the shared Switch keeps its look but gets a 44px tap area. */
@media (max-width: 767px) { [role="switch"]::before { content: ''; position: absolute; inset: -9px -4px; } }
.modal-wrap { position: fixed; inset: var(--proto-bar) 0 0 0; z-index: 90; display: flex; align-items: center; justify-content: center; padding: 24px; }
.modal-wrap .side-scrim { position: absolute; inset: 0; z-index: 0; }
.modal-box { position: relative; z-index: 1; display: flex; flex-direction: column; width: 100%; max-width: 560px; max-height: calc(100dvh - var(--proto-bar) - 48px); background: var(--elevated); border: 1px solid var(--line-strong); border-radius: 18px; box-shadow: var(--shadow-md); overflow: hidden; }
.modal-box .body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
</style>
</head>

function dailySyncCard() {
  const conns = bankStatus();
  const manage = can('simplefin');
  if (!conns) return card(`${cardHeader('Daily sync', '', '', true)}<div class="px-4 md:px-6 py-5 text-[13px] text-content-3">Daily sync starts once a bank connection is added.</div>`);
  const problems = conns.some((c) => c.status !== 'working');
  const rows = [
    ['Runs', 'Every day at 5:30 am, server time'],
    ['Last sync', ui.daily ? (problems ? `Today 5:31 am · ${conns.filter((c) => c.status !== 'working').length} of ${conns.length} connections had problems` : 'Today 5:31 am · 23 new transactions') : 'Yesterday 5:30 am · 18 new transactions'],
    ['Next sync', ui.daily ? (nextRetry(conns) ? `Trying again at ${nextRetry(conns)}, then tomorrow 5:30 am` : 'Tomorrow 5:30 am') : 'Off. Switch daily sync on to sync each morning.'],
  ];
  return card(`<div class="flex items-start justify-between gap-4 px-4 md:px-6 py-4 md:py-[18px] border-b border-line"><div class="min-w-0"><div class="flex items-center gap-2.5 flex-wrap"><span class="text-[17px] font-extrabold tracking-tight text-content">Daily sync</span>${ui.daily ? '' : statusPill('paused')}</div><div class="text-[13px] text-content-3 mt-1 leading-snug max-w-[620px]">Each morning Ledger pulls new transactions and balances from every connection. ${ui.daily ? '' : 'Daily sync is off. Sync now still works.'}</div></div>${manage ? sw(ui.daily, 'Daily sync', 'daily') : ''}</div>
    <dl class="m-0 px-4 md:px-6 py-2">${rows.map(([k, v]) => `<div class="flex flex-col sm:flex-row sm:items-baseline gap-0.5 sm:gap-4 py-2"><dt class="font-mono text-[11px] tracking-[0.1em] uppercase text-content-3 sm:w-[110px] shrink-0">${k}</dt><dd class="m-0 text-sm text-content tabular">${v}</dd></div>`).join('')}</dl>
    <div class="px-4 md:px-6 py-3.5 border-t border-line text-[12.5px] text-content-3 leading-snug">The morning run also refreshes investment benchmark prices and checks budgets for over-budget alerts.${manage ? '' : ' An admin manages connections and daily sync.'}</div>`);
}

function connectionsCard() {

    return `<div class="rounded-[18px] border border-dashed border-line-strong bg-surface px-5 md:px-[26px] py-6 flex items-center gap-5 flex-wrap"><span class="flex-none w-[46px] h-[46px] rounded-[12px] bg-surface-2 text-content-3 flex items-center justify-center">${I.wifi}</span><div class="flex-1 min-w-[220px]"><div class="text-[17px] font-extrabold tracking-tight text-content">Connect your SimpleFIN account</div><div class="text-[13.5px] text-content-3 mt-1 leading-snug max-w-[560px]">Set up your bank connections on SimpleFIN, then paste your setup token here. SimpleFIN will populate the accounts you can link to. Plans start at $1.50/month.</div></div>${manage ? `<button type="button" class="${btnPrimary}">Connect SimpleFIN</button>` : '<span class="text-[13px] text-content-3">An admin manages connections.</span>'}</div>`;
  }

    <div class="flex-1 min-w-[200px]"><div class="flex items-center gap-2.5 flex-wrap"><span class="text-[17px] font-extrabold tracking-tight text-content">SimpleFIN</span>${statusPill(worst)}</div><div class="text-[13px] text-content-3 mt-0.5">${summary}</div></div>
    <div class="flex items-center gap-2 shrink-0 flex-wrap">${syncBtn}${manage ? `<button type="button" class="${btnSecondarySm}">${I.plus}Add connection</button>` : ''}</div></div>
    <div class="border-t border-line px-4 md:px-6 py-3.5">${caption('Connections', 'mb-1')}${conns.map((c) => `
      <div class="py-3 ${c === conns[0] ? '' : 'border-t border-line'}"><div class="flex items-center gap-2.5 flex-wrap"><span class="text-sm font-semibold text-content">${esc(c.label)}</span><span class="h-[22px] px-2 rounded-md text-[11px] font-semibold inline-flex items-center bg-surface-2 text-content-2">${c.shared ? 'Shared' : 'Personal'}</span>${statusPill(ui.daily || c.status !== 'working' ? c.status : 'paused')}
        ${manage && !isPhone() ? `<span class="ml-auto flex items-center gap-1.5">${c.status === 'reconnect' ? `<button type="button" class="${btnRow}" style="color:var(--primary)">Reconnect</button>` : ''}<button type="button" title="Edit connection" aria-label="Edit ${esc(c.label)}" class="w-8 h-8 rounded-[8px] flex items-center justify-center text-content-3 hover:text-content hover:bg-surface-2">${I.pencil}</button>${confirmDelete('conn' + c.id, 'Disconnect', 'Confirm disconnect?')}</span>` : ''}</div>
        <div class="text-[13px] mt-1 leading-snug" style="color:${c.status === 'working' ? 'var(--text-3)' : STATUS[c.status][0]}">${c.status === 'reconnect' && !manage ? 'SimpleFIN didn’t accept the sign-in. Ask an admin to reconnect.' : !ui.daily && c.status === 'working' ? 'Daily sync is off. Sync now still works.' : c.line}</div>
        <div class="font-mono text-[12px] text-content-3 mt-1">${c.linked} accounts linked</div>
        ${manage && isPhone() ? `<div class="flex items-center gap-1.5 mt-2.5">${c.status === 'reconnect' ? `<button type="button" class="${btnRow}" style="color:var(--primary)">Reconnect</button>` : ''}<button type="button" class="${btnRow}">${I.pencil}Edit</button>${confirmDelete('conn' + c.id, 'Disconnect', 'Confirm disconnect?')}</div>` : ''}</div>`).join('')}</div>
    ${manage ? `<div class="border-t border-line"><button type="button" data-act="sfopen" aria-expanded="${ui.sfOpen}" class="w-full flex items-center gap-2 px-4 md:px-6 py-3.5 text-left"><span class="text-content-3" style="transform:rotate(${ui.sfOpen ? 90 : 0}deg);display:flex">${I.chevR}</span>${caption('Accounts from SimpleFIN')}<span class="font-mono text-[12px] text-content-3">· 11 accounts</span></button>

}

function bankPanel() {
  const manage = can('simplefin');
  return `<div class="flex flex-col gap-[22px]">${panelHeader('Bank sync', 'Your SimpleFIN connections bring in transactions and balances.')}

function rulesCards(compact = false) {
  const q = ui.search.trim().toLowerCase();
  const all = ui.rules.filter((r) => !q || r.match.toLowerCase().includes(q) || CATS[r.cat][1].toLowerCase().includes(q));
  const limit = compact ? 5 : 25;
  const short = !ui.showAllRules && !q && all.length > limit;
  const list = short ? all.slice(0, limit) : all;
  const del = can('tx.edit');
  const ruleRow = (r) => { const [emo, name, group] = CATS[r.cat]; return `
    <div class="flex items-center gap-3 px-4 md:px-6 min-h-[64px] py-2.5 border-t border-line">
      ${r.kind === 'merchant' ? avatar(r.match, 'var(--c-indigo)', 34) : `<span class="w-[34px] h-[34px] rounded-full bg-surface-2 text-content-3 flex items-center justify-center shrink-0">${I.search}</span>`}
      <div class="flex-1 min-w-0"><div class="text-[15px] font-bold text-content rule-title">${r.kind === 'merchant' ? esc(r.match) : r.kind === 'contains' ? `Description contains “<span class="font-mono text-[13.5px]">${esc(r.match)}</span>”` : `Description matches the pattern <span class="font-mono text-[13.5px]">${esc(r.match)}</span>`}</div>
      <div class="text-[12.5px] text-content-3 rule-sub"><span class="text-content-2 font-semibold">${emo} ${esc(name)}</span> · ${esc(group)}</div></div>
      ${del ? confirmDelete('rule' + r.id) : ''}</div>`; };
  const rulesCard = ui.rules.length === 0
    ? card(`${cardHeader('Always categorize', '0 rules')}<div class="border-t border-line px-6 py-10 text-center"><div class="text-[15px] font-bold text-content">No rules yet</div><div class="text-sm text-content-3 mt-1 max-w-[440px] mx-auto leading-snug">When you change a transaction's category, Ledger can offer to remember it, and the rule appears here.</div></div>`)
    : card(`${cardHeader('Always categorize', `${ui.rules.length} ${ui.rules.length === 1 ? 'rule' : 'rules'}`)}<div class="px-4 md:px-6 pb-3 -mt-1 text-[12.5px] text-content-3 leading-snug">Ledger checks these in order and uses the first one that matches.</div>
      <div class="px-4 md:px-6 pb-3.5"><label class="relative block"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-content-3">${I.search}</span><span class="sr-only">Search rules</span><input data-input="search" value="${esc(ui.search)}" placeholder="Search rules by merchant or category…" class="h-[38px] w-full pl-9 pr-3 rounded-[10px] bg-surface-2 border border-line-strong text-[13.5px] text-content outline-none placeholder:text-content-3"></label></div>
      ${list.map(ruleRow).join('')}${short ? `<button type="button" data-act="allrules" class="w-full flex items-center justify-center gap-2 px-6 py-3.5 border-t border-line bg-surface-2 text-content-2 text-sm font-bold hover:text-content">Show all ${all.length} rules</button>` : ''}${list.length === 0 ? `<div class="border-t border-line px-6 py-8 text-center text-sm text-content-3">No rules match “${esc(ui.search.trim())}”.</div>` : ''}`);
  const mutedCard = card(`${cardHeader('Not suggesting rules for', ui.muted.length ? `${ui.muted.length} merchants` : '')}<div class="px-4 md:px-6 pb-3.5 -mt-1 text-[12.5px] text-content-3 leading-snug">Someone chose “Don’t ask again” for these merchants, so Ledger won’t offer a rule when their transactions are recategorized. Undo to get suggestions again.</div>
    ${ui.muted.length ? ui.muted.map((m) => `<div class="flex items-center gap-3 px-4 md:px-6 min-h-[56px] py-2 border-t border-line">${avatar(m.name, 'var(--c-amber)', 30)}<span class="flex-1 min-w-0 text-sm font-semibold text-content truncate">${esc(m.name)}</span>${del ? `<button type="button" data-act="undo:${m.id}" class="${btnRow}">Undo</button>` : ''}</div>`).join('') : '<div class="border-t border-line px-6 py-5 text-sm text-content-3">None. Ledger offers rules for every merchant.</div>'}`);
  return { rulesCard, mutedCard };
}

function rulesPanel() {
  const { rulesCard, mutedCard } = rulesCards();
  return `<div class="flex flex-col gap-[22px]">${panelHeader('Rules', 'When you change a transaction’s category, Ledger can offer to always categorize that merchant the same way. Those rules are listed here. Deleting one stops it for new transactions; transactions already categorized stay as they are.')}${rulesCard}${mutedCard}</div>`;
}

function extrasCards() {
  const head = (title, desc, right) => `<div class="flex items-start justify-between gap-4 px-4 md:px-6 py-[18px] border-b border-line"><div class="min-w-0"><div class="text-[17px] font-extrabold tracking-tight text-content">${title}</div><div class="text-[13px] text-content-3 mt-1 leading-snug max-w-[640px]">${desc}</div></div>${right || ''}</div>`;
  const on = ui.st.extras === 'on';
  const setUp = (title, desc, key, status) => card(`${head(title, desc, sw(ui[key], title, key))}<div class="px-4 md:px-6 py-4 text-[13px] text-content-2">${ui[key] ? status : 'Off. Turn it on to run it each morning.'}</div>`);
  const notSet = (title, desc) => card(`<div class="flex items-start justify-between gap-4 px-4 md:px-6 py-[18px]"><div class="min-w-0"><div class="text-[17px] font-extrabold tracking-tight text-content">${title}</div><div class="text-[13px] text-content-3 mt-1 leading-snug max-w-[640px]">${desc}</div><div class="text-[13px] font-semibold text-content-2 mt-2.5">Not set up yet</div></div></div>`);
  return card(`${head('AI categorizing', 'A local AI model on your own network suggests a category when the rules aren’t sure, for bank sync and CSV imports.', sw(ui.aiOn, 'AI categorizing', 'ai'))}
    <div class="px-4 md:px-6 py-5 flex flex-col gap-4 max-w-[560px]">${field('Ollama address', `<input class="${inputCls} font-mono" value="http://192.168.1.50:11434">`)}${field('Model', `<input class="${inputCls} font-mono" value="qwen3:4b">`, 'Any chat model the Ollama server has downloaded.')}
    <div class="flex items-center gap-3 flex-wrap"><button type="button" class="${btnPrimary}">Save</button><button type="button" class="${btnSecondary}">Test connection</button>${on ? '<span class="text-[13px] font-semibold text-negative">Couldn’t reach the Ollama server at that address.</span>' : '<span class="text-[13px] font-semibold text-positive">Connected · 180 ms</span>'}</div></div>`)
    + (on ? setUp('Amazon order matching', 'Matches Amazon orders to your transactions and categorizes them from the items bought.', 'amazonOn', 'Last matched this morning · 4 orders matched')
      + setUp('Investment benchmarks', 'Compares your investments with market indexes on the Investments page.', 'benchOn', 'Prices last updated this morning')
      : notSet('Amazon order matching', 'Matches Amazon orders to your transactions and categorizes them from the items bought.')
      + notSet('Investment benchmarks', 'Compares your investments with market indexes on the Investments page.'));
}

function extrasPanel() {

// ----- users & permissions -----
const canTouch = (u) => u.role !== 'owner' && (viewer().role === 'owner' || (viewer().role === 'admin' && u.role === 'member'));
const roleLabel = (r) => r[0].toUpperCase() + r.slice(1);
const ROLE_TONE = { owner: 'var(--c-orange)', admin: 'var(--positive)', member: 'var(--c-blue)' };

function roleControl(u) {
  if (u.role === 'owner') return pill(ROLE_TONE.owner, 'Owner', 'rounded-[7px]');
  if (viewer().role === 'owner' && u.id !== viewer().id) return `<div class="relative"><select data-input="role:${u.id}" aria-label="Role for ${esc(u.name)}" class="tap h-[34px] pl-3 pr-8 rounded-[8px] border border-line-strong text-[12.5px] font-bold appearance-none cursor-pointer outline-none" style="${u.role === 'admin' ? 'background:color-mix(in srgb, var(--primary) 16%, transparent);color:var(--primary)' : 'background:var(--surface-2);color:var(--c-blue)'}"><option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option><option value="member" ${u.role === 'member' ? 'selected' : ''}>Member</option></select><span class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2" style="color:${u.role === 'admin' ? 'var(--primary)' : 'var(--c-blue)'}">${I.chevD}</span></div>`;
  return pill(ROLE_TONE[u.role], roleLabel(u.role), 'rounded-[7px]');
}

function accessEditor(u) {
  const cur = presetOf(u.perms);
  const touch = canTouch(u);
  const pend = ui.pending && ui.pending.id === u.id ? ui.pending.preset : null;
  const opts = Object.entries(PRESETS).map(([k, p]) => ({ k, ...p }));
  if (cur === 'custom') opts.push({ k: 'custom', label: 'Custom', desc: 'Switches chosen one by one, below.' });
  const custOpen = ui.customize.has(u.id);
  return `<div class="flex flex-col gap-3">
    <div role="radiogroup" aria-label="Access for ${esc(u.name)}" class="grid gap-2" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${opts.map((o) => `
      <button type="button" role="radio" aria-checked="${cur === o.k}" ${touch && o.k !== 'custom' ? `data-act="preset:${u.id}:${o.k}"` : 'aria-disabled="true"'} class="preset"><span class="dot"></span><span class="min-w-0"><span class="block text-[13.5px] font-semibold text-content">${o.label}</span><span class="block text-[12px] text-content-3 leading-snug">${o.desc}</span></span></button>`).join('')}</div>
    ${pend ? notice('warning', `This replaces ${esc(u.name.split(' ')[0])}’s custom switches with ${PRESETS[pend].label}.`, `<span class="flex gap-2 shrink-0"><button type="button" data-act="cancelpreset" class="${btnRow}">Cancel</button><button type="button" data-act="applypreset" class="${btnRow}" style="background:var(--primary);color:var(--on-primary);border-color:var(--primary)">Confirm</button></span>`) : ''}
    <div><button type="button" data-act="customize:${u.id}" aria-expanded="${custOpen}" class="tap inline-flex items-center gap-1.5 text-[13px] font-semibold text-content-2 hover:text-content min-h-[32px]"><span style="display:flex;transform:rotate(${custOpen ? 180 : 0}deg)">${I.chevD}</span>${custOpen ? 'Hide switches' : 'Customize'}</button></div>
    ${custOpen ? `<div class="flex flex-col gap-4" data-anchor="switches">${PERMS.map((g) => `<div>${caption(g.g, 'mb-2')}<div class="grid gap-2" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">${g.items.map(([k, label, desc]) => { const on = u.perms.has(k); return `<button type="button" role="checkbox" aria-checked="${on}" ${touch ? `data-act="perm:${u.id}:${k}"` : 'aria-disabled="true"'} class="flex items-start gap-3 px-3.5 py-[11px] rounded-[11px] border border-line bg-surface-2 text-left hover:border-line-strong transition-colors">${checkBox(on)}<span class="min-w-0"><span class="block text-[13.5px] font-semibold text-content">${label}</span><span class="block text-[12px] text-content-3 leading-snug">${desc}</span></span></button>`; }).join('')}</div></div>`).join('')}</div>` : ''}</div>`;
}

const roleNote = (u) => u.role === 'owner' ? 'App owner. Cannot be restricted or removed.' : u.role === 'admin' ? (viewer().role === 'owner' ? 'Admins can use everything and manage members.' : 'Admins can use everything and manage members. Only the owner can change admins.') : '';
const badges = (u) => `${u.id === viewer().id ? '<span class="text-[12px] text-content-3">(you)</span>' : ''}${!u.active ? pill('var(--negative)', 'Inactive', 'h-[22px] px-2 text-[11px]') : ''}${u.twofa ? pill('var(--positive)', 'Two-step on', 'h-[22px] px-2 text-[11px]') : ''}`;

function personDetail(u) {
  // Shared by version B's side panel and every phone sheet.
  const touch = canTouch(u);
  return `<div class="flex flex-col gap-5">
    <div class="flex items-center gap-3">${avatar(u.name, u.color, 44)}<div class="min-w-0"><div class="flex items-center gap-2 flex-wrap"><span class="text-[16px] font-bold text-content">${esc(u.name)}</span>${badges(u)}</div><div class="text-[13px] text-content-3 font-mono truncate">@${esc(u.username)}</div></div></div>
    <div class="flex items-center justify-between gap-3"><div>${caption('Role')}${roleNote(u) ? `<div class="text-[12.5px] text-content-3 mt-1 leading-snug">${roleNote(u)}</div>` : ''}</div>${roleControl(u)}</div>
    ${u.role === 'member' ? `<div>${caption('Access', 'mb-2')}${accessEditor(u)}</div>` : ''}<span data-anchor="actions"></span>
    ${touch ? `<div class="flex flex-col gap-2.5 pt-1 border-t border-line" style="padding-top:16px">${caption('Sign-in')}
      <div class="flex items-center justify-between gap-3"><span class="text-[13px] text-content-2">${u.active ? 'Can sign in.' : 'Sign-in is blocked until re-activated.'}</span>${sw(u.active, 'Active', 'active:' + u.id)}</div>
      ${u.twofa ? `<div class="flex items-center justify-between gap-3"><span class="text-[13px] text-content-2">Two-step sign-in is on.</span>${confirmDelete('2fa' + u.id, 'Reset two-step', 'Confirm reset?')}</div>` : ''}
      <div class="flex gap-2.5 flex-wrap pt-1"><button type="button" class="${btnSecondary}">${I.pencil}Edit name or password</button>${u.id !== viewer().id ? `<button type="button" class="${btnDanger}">${I.trash}Delete user</button>` : ''}</div></div>` : ''}</div>`;
}

function usersPanel() {
  const v = viewer();
  const header = panelHeader('Users & permissions', 'Everyone who can sign in to this household. Admins manage people; each member gets View only, Everyday, Everything except managing people, or switches you choose.', pill('var(--primary)', `${I.shield}You are ${roleLabel(v.role)}`, 'h-[30px] px-3'));
  if (ui.loading) return `<div class="flex flex-col gap-[22px]">${header}${card(`${cardHeader('Household members')}<div class="flex items-center justify-center py-16 border-t border-line"><div class="rounded-full animate-spin border-line border-t-primary" style="width:32px;height:32px;border-width:3px;border-style:solid" role="status" aria-label="Loading"></div></div>`)}</div>`;
  if (ui.error) return `<div class="flex flex-col gap-[22px]">${header}${notice('error', 'Couldn’t load your settings. Check your connection and try again.')}<div><button type="button" data-act="retry" class="${btnSecondary}">${I.refresh}Try again</button></div></div>`;
  const phone = isPhone();
  const rows = ui.users.map((u) => {
    if (phone || POPUP) {
      return `<button type="button" data-act="openuser:${u.id}" class="row-btn flex items-center gap-3 px-4 md:px-6 min-h-[64px] py-2.5 border-t border-line">${avatar(u.name, u.color, 40)}
        <span class="flex-1 min-w-0"><span class="flex items-center gap-2 min-w-0"><span class="text-[15px] font-bold text-content truncate">${esc(u.name)}</span>${badges(u)}</span><span class="block text-[12.5px] text-content-3 truncate">${roleLabel(u.role)}${u.role === 'member' ? ` · ${accessLabel(u)}` : ''}</span></span>
        ${!phone ? `<span class="font-mono text-[12.5px] text-content-3 hidden md:block">@${esc(u.username)}</span>` : ''}<span class="text-content-3">${I.chevR}</span></button>`;
    }
    const open = ui.expanded.has(u.id);
    return `<div class="border-t border-line"><div class="flex items-center gap-4 px-6 py-[18px]">${avatar(u.name, u.color, 40)}
      <div class="flex-1 min-w-0"><div class="flex items-center gap-2 min-w-0"><span class="text-[15px] font-bold text-content truncate">${esc(u.name)}</span>${badges(u)}</div><div class="text-[13px] text-content-3 font-mono truncate">@${esc(u.username)}</div></div>
      <div class="flex items-center gap-2 shrink-0">${roleControl(u)}
        ${canTouch(u) ? `<button type="button" class="${btnRow}">${I.pencil}Edit</button>` : ''}${canTouch(u) && u.twofa ? confirmDelete('2fa' + u.id, 'Reset two-step', 'Confirm reset?') : ''}
        ${canTouch(u) && u.id !== v.id ? `<button type="button" class="inline-flex items-center gap-1.5 h-[34px] px-3 rounded-[8px] border border-line-strong bg-transparent text-negative text-[12.5px] font-bold">${I.trash}Delete</button>` : ''}</div></div>
      ${u.role !== 'member' ? `<div class="pb-4 text-[12.5px] italic text-content-3" style="padding-left:80px;padding-right:24px">${roleNote(u)}</div>` : `<div class="pb-4" style="padding-left:80px;padding-right:24px"><button type="button" data-act="expand:${u.id}" aria-expanded="${open}" class="inline-flex items-center gap-1.5 text-[13px] font-semibold text-content-2 hover:text-content"><span style="display:flex;transform:rotate(${open ? 180 : 0}deg)">${I.chevD}</span>${open ? 'Hide access' : `Access: ${accessLabel(u)}`}</button>${open ? `<div class="mt-3">${accessEditor(u)}</div>` : ''}</div>`}</div>`;
  }).join('');
  return `<div class="flex flex-col gap-[22px]">${header}
    ${card(`${cardHeader('Household members', `${ui.users.length} people`)}${rows}<button type="button" class="w-full flex items-center justify-center gap-2 px-6 py-4 border-t border-line bg-surface-2 text-content-2 text-sm font-bold hover:text-content hover:bg-elevated transition-colors">${I.plus}Add user</button>`)}
    ${v.role === 'owner' ? card(`<div class="px-4 md:px-6 py-3.5 border-b border-line">${caption('Two-step sign-in requirements')}</div>
      <div class="flex items-center justify-between gap-4 px-4 md:px-6 py-4"><div class="min-w-0"><div class="text-[14.5px] font-semibold text-content">Require two-step sign-in for admins</div><div class="text-[12.5px] text-content-3 mt-0.5">Admins must set it up before they can use Ledger.</div></div>${sw(ui.twofaAdmins, 'Require two-step sign-in for admins', 'tfa:admins')}</div>
      <div class="flex items-center justify-between gap-4 px-4 md:px-6 py-4 border-t border-line"><div class="min-w-0"><div class="text-[14.5px] font-semibold text-content">Require two-step sign-in for members</div><div class="text-[12.5px] text-content-3 mt-0.5">Every member must set it up.</div></div>${sw(ui.twofaMembers, 'Require two-step sign-in for members', 'tfa:members')}</div>`) : ''}</div>`;
}

const PANELS = { profile: profilePanel, security: securityPanel, notifications: notificationsPanel, accounts: accountsPanel, bank: bankPanel, categories: categoriesPanel, merchants: merchantsPanel, rules: rulesPanel, users: usersPanel, extras: extrasPanel, auto: autoPanel };

function renderOverlay() {
  const el = document.getElementById('overlay');
  const u = ui.open && ui.users.find((x) => x.id === ui.open);
  const showSheet = u && (isPhone() || POPUP) && ui.panel === 'users' && !ui.loading && !ui.error;
  if (!showSheet) { el.innerHTML = ''; return; }
  const head = `<div class="flex items-start justify-between gap-3 shrink-0 px-5 pt-1 pb-3 border-b border-line"><div class="min-w-0"><div class="text-[18px] font-extrabold tracking-tight text-content leading-tight">${esc(u.name)}</div><div class="text-[13px] text-content-3 mt-1">${roleLabel(u.role)}${u.role === 'member' ? ` · ${accessLabel(u)}` : ''}</div></div><button type="button" data-act="closeuser" aria-label="Close" class="shrink-0 w-8 h-8 -mr-1.5 flex items-center justify-center rounded-[8px] text-content-2 hover:bg-surface-2">${I.x}</button></div>`;
  const foot = `<div class="shrink-0 px-5 py-3 border-t border-line flex justify-end"><button type="button" data-act="closeuser" class="${btnPrimary} w-full md:w-auto">Done</button></div>`;
  const wasOpen = !!el.innerHTML;
  el.innerHTML = isPhone()
    ? `<div class="side-scrim" data-act="closeuser"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(u.name)}"><div class="flex justify-center py-2.5"><div class="w-9 h-1 rounded-full bg-line-strong"></div></div>${head}<div class="body px-5 py-4">${personDetail(u)}</div>${foot}</div>`
    : B ? `<div class="side-scrim" data-act="closeuser"></div><aside class="side-panel" role="dialog" aria-modal="true" aria-label="${esc(u.name)}"><div class="pt-4">${head}</div><div class="body px-5 py-5">${personDetail(u)}</div>${foot}</aside>`
    : `<div class="modal-wrap"><div class="side-scrim" data-act="closeuser" style="backdrop-filter:blur(3px)"></div><div class="modal-box" role="dialog" aria-modal="true" aria-label="${esc(u.name)}"><div class="shrink-0 flex items-start justify-between gap-4 px-6 pt-5 pb-4 border-b border-line"><div class="min-w-0"><h2 class="text-[18px] font-extrabold tracking-tight text-content m-0 leading-tight">${esc(u.name)}</h2><p class="text-[13px] text-content-3 mt-1 m-0 leading-snug">${roleLabel(u.role)}${u.role === 'member' ? ` · ${accessLabel(u)}` : ''}</p></div><button type="button" data-act="closeuser" aria-label="Close" class="shrink-0 w-8 h-8 -mr-2 -mt-1 flex items-center justify-center rounded-[8px] text-content-2 hover:bg-surface-2 hover:text-content">${I.x}</button></div><div class="body px-6 py-5">${personDetail(u)}</div><div class="shrink-0 px-6 py-4 border-t border-line flex justify-end"><button type="button" data-act="closeuser" class="${btnPrimary}">Done</button></div></div></div>`;
  if (!wasOpen) el.querySelector('button[data-act="closeuser"][aria-label="Close"]')?.focus({ preventScroll: true });
  // State captures that show the lower part of the sheet/panel keep that scroll across re-renders.
  const body = el.querySelector('.body');
  if (body && ui.sheetScroll === 'bottom') body.scrollTop = body.scrollHeight;
  if (body && ui.sheetScroll === 'switches') { const a = body.querySelector('[data-anchor="switches"]'); if (a) body.scrollTop = a.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop - 12; }
}

// ---------- shell ----------
function render() {
  const phone = isPhone();
  const v = viewer();
  document.querySelectorAll('[data-viewer-name]').forEach((e) => { e.textContent = v.name.split(' ')[0]; });
  document.querySelectorAll('[data-viewer-initial]').forEach((e) => { e.textContent = v.name[0]; });
  const allowed = menuSections().flatMap((s) => s.items.map((i) => i[0]));
  if (!allowed.includes(ui.panel)) ui.panel = 'profile';
  const showMenuOnly = phone && ui.phoneMenu;
  const title = document.getElementById('mobile-bar-title');
  const back = document.getElementById('mobile-bar-back');
  if (title) title.innerHTML = `<span class="block truncate text-[17px] font-extrabold tracking-tight text-content">${showMenuOnly ? 'Settings' : TITLES[ui.panel]}</span>`;
  if (back) back.innerHTML = showMenuOnly ? '' : `<button type="button" data-act="phonemenu" aria-label="Back to Settings" class="w-10 h-10 rounded-[10px] flex items-center justify-center text-content-2 active:bg-surface-2">${I.back}</button>`;
  const pageHeader = phone ? '' : `<div class="md:-mt-7 -mx-8 px-8 py-4 mb-6 bg-bg border-b border-line flex items-center justify-between gap-4"><div class="flex items-center gap-2.5"><span class="text-content-3">${svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>', 20, 2)}</span><h1 class="page-title text-[22px] font-extrabold text-content tracking-tight leading-tight m-0">Settings</h1></div></div>`;
  document.getElementById('main').innerHTML = `${pageHeader}<div class="flex flex-col md:flex-row gap-7 items-start">${showMenuOnly ? renderMenu(true) : phone ? '' : renderMenu(false)}${showMenuOnly ? '' : `<div class="flex-1 min-w-0 w-full">${PANELS[ui.panel]()}</div>`}</div>`;
  renderOverlay();
  document.documentElement.classList.toggle('proto-locked', !!document.getElementById('overlay').innerHTML);
}

// ---------- prototype bar ----------
function setTheme(t) {
  document.documentElement.classList.toggle('dark', t === 'dark');
  ui.theme = t;
}
function syncUrl() {
  const p = new URLSearchParams(location.search);
  p.set('state', ui.stateName); p.set('theme', ui.theme);
  history.replaceState(null, '', `${location.pathname}?${p}`);
  document.documentElement.dataset.state = ui.stateName;
  document.documentElement.dataset.theme = ui.theme;
}
function renderBar() {
  const label = B ? 'Version B · one Automatic page · people open in a side panel' : POPUP ? 'Version C · each in its home · people open in a pop-up window (Robert’s picks)' : 'Version A · each in its home · access expands inline';
  document.getElementById('proto-bar').innerHTML = `<span class="tag">Prototype ${VERSION.toUpperCase()}</span><span class="ver">${label}</span><span class="spacer"></span>
    <label><span class="lbl">State</span><select id="proto-state" aria-label="Prototype state">${STATE_NAMES.map((s) => `<option value="${s}" ${s === ui.stateName ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
    <label><span class="lbl">Theme</span><select id="proto-theme" aria-label="Prototype theme">${THEMES.map((t) => `<option value="${t}" ${t === ui.theme ? 'selected' : ''}>${t}</option>`).join('')}</select></label>`;
  document.getElementById('proto-state').onchange = (e) => { reset(e.target.value); render(); syncUrl(); window.scrollTo(0, 0); };
  document.getElementById('proto-theme').onchange = (e) => { setTheme(e.target.value); render(); syncUrl(); };
}

function toast(msg) {
  const t = document.getElementById('toasts');
  const d = document.createElement('div');
  d.className = 'flex items-center gap-2.5 px-4 py-3 rounded-[12px] bg-elevated border border-line shadow-md text-sm font-semibold text-content';
  d.innerHTML = `<span class="text-positive">${I.check}</span>${esc(msg)}`;
  t.appendChild(d); setTimeout(() => d.remove(), 2600);
}

// ---------- interactions ----------
let confirmTimer;
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.getAttribute('aria-disabled') === 'true') return;
  const [act, a, b] = el.dataset.act.split(':');
  ui.sheetScroll = null;
  const user = (id) => ui.users.find((u) => u.id === Number(id));
  switch (act) {
    case 'nav': ui.panel = a; ui.phoneMenu = false; ui.search = ''; window.scrollTo(0, 0); break;
    case 'phonemenu': ui.phoneMenu = true; ui.open = null; break;
    case 'theme': setTheme(a); syncUrl(); renderBar(); break;
    case 'expand': ui.expanded.has(+a) ? ui.expanded.delete(+a) : ui.expanded.add(+a); break;
    case 'customize': ui.customize.has(+a) ? ui.customize.delete(+a) : ui.customize.add(+a); break;
    case 'openuser': ui.open = +a; ui.pending = null; break;
    case 'closeuser': { const id = ui.open; ui.open = null; ui.pending = null; render(); document.querySelector(`[data-act="openuser:${id}"]`)?.focus(); return; }
    case 'preset': {
      const u = user(a);
      if (presetOf(u.perms) === b) break;
      if (presetOf(u.perms) === 'custom') { ui.pending = { id: u.id, preset: b }; break; }
      u.perms = new Set(PRESETS[b].keys); toast(`${u.name.split(' ')[0]} now has ${PRESETS[b].label}`); break;
    }
    case 'applypreset': { const u = user(ui.pending.id); u.perms = new Set(PRESETS[ui.pending.preset].keys); toast(`${u.name.split(' ')[0]} now has ${PRESETS[ui.pending.preset].label}`); ui.pending = null; break; }
    case 'cancelpreset': ui.pending = null; break;
    case 'perm': { const u = user(a); u.perms.has(b) ? u.perms.delete(b) : u.perms.add(b); ui.pending = null; break; }
    case 'active': { const u = user(a); u.active = !u.active; break; }
    case 'del': {
      if (ui.confirming !== a) { ui.confirming = a; clearTimeout(confirmTimer); confirmTimer = setTimeout(() => { ui.confirming = null; render(); }, 3000); break; }
      ui.confirming = null;
      if (a.startsWith('rule')) { ui.rules = ui.rules.filter((r) => 'rule' + r.id !== a); toast('Rule deleted'); }
      else if (a.startsWith('2fa')) toast('Two-step sign-in reset');
      else toast('Connection removed');
      break;
    }
    case 'undo': { const m = ui.muted.find((x) => x.id === +a); ui.muted = ui.muted.filter((x) => x !== m); toast(`Ledger will suggest rules for ${m.name} again`); break; }
    case 'daily': ui.daily = !ui.daily; toast(ui.daily ? 'Daily sync is on' : 'Daily sync is off'); break;
    case 'overbudget': ui.overBudget = !ui.overBudget; toast(ui.overBudget ? 'Over-budget alerts on' : 'Over-budget alerts off'); break;
    case 'ai': ui.aiOn = !ui.aiOn; toast(ui.aiOn ? 'AI categorizing on' : 'AI categorizing off'); break;
    case 'amazonOn': ui.amazonOn = !ui.amazonOn; break;
    case 'benchOn': ui.benchOn = !ui.benchOn; break;
    case 'tfa': a === 'admins' ? (ui.twofaAdmins = !ui.twofaAdmins) : (ui.twofaMembers = !ui.twofaMembers); break;
    case 'allrules': ui.showAllRules = true; break;
    case 'sfopen': ui.sfOpen = !ui.sfOpen; break;
    case 'retry': ui.error = false; break;
    default: return;
  }
  const focusAct = el.dataset.act;
  render();
  const again = document.querySelector(`[data-act="${CSS.escape(focusAct)}"]`);
  if (again) again.focus({ preventScroll: true });
});
document.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.input;
  if (k === 'search') { ui.search = e.target.value; const pos = e.target.selectionStart; render(); const s = document.querySelector('[data-input="search"]'); s.focus(); s.setSelectionRange(pos, pos); }
});
document.addEventListener('change', (e) => {
  const k = e.target.dataset && e.target.dataset.input;
  if (k && k.startsWith('role:')) { const u = ui.users.find((x) => x.id === +k.split(':')[1]); u.role = e.target.value; if (u.role === 'member' && !u.perms) u.perms = new Set(PRESETS.everyday.keys); toast(`${u.name.split(' ')[0]} is now ${u.role === 'admin' ? 'an admin' : 'a member'}`); render(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ui.open) { const id = ui.open; ui.open = null; ui.pending = null; render(); document.querySelector(`[data-act="openuser:${id}"]`)?.focus(); } });
matchMedia('(max-width: 767px)').addEventListener('change', render);

// ---------- boot ----------
const params = new URLSearchParams(location.search);
const startState = STATE_NAMES.includes(params.get('state')) ? params.get('state') : STATE_NAMES[0];
setTheme(THEMES.includes(params.get('theme')) ? params.get('theme') : 'light');
reset(startState);
renderBar();
render();
requestAnimationFrame(() => syncUrl());
</script>
</body>
</html>
