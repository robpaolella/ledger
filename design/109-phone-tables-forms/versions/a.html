<style>/* Prototype-only chrome and the few new pieces this design proposes. Colours are tokens. */
:root { --proto-bar: 48px; }
.proto-shell { min-height: calc(100dvh - var(--proto-bar)); }
#proto-bar {
  position: sticky; top: 0; z-index: 100; height: var(--proto-bar);
  display: flex; align-items: center; gap: 10px; padding: 0 12px;
  background: repeating-linear-gradient(135deg, var(--surface-2) 0 10px, var(--surface) 10px 20px);
  border-bottom: 2px dashed var(--warning); font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 11px; color: var(--text-2);
}
#proto-bar .tag { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--warning); white-space: nowrap; }
#proto-bar .ver { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#proto-bar label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
#proto-bar select { height: 32px; border-radius: 8px; border: 1px dashed var(--warning); background: var(--surface); color: var(--text); font: inherit; font-size: 12px; padding: 0 6px; }
#proto-bar select:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
#proto-bar .spacer { flex: 1; }
@media (max-width: 767px) {
  #proto-bar { gap: 6px; padding: 0 8px; }
  #proto-bar .ver, #proto-bar .lbl { display: none; }
  #proto-bar label:first-of-type { flex: 1; min-width: 0; }
  #proto-bar label:first-of-type select { width: 100%; }
}

button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--ring); outline-offset: 2px;
}

/* Access preset choice: radio rows (new element for Robert to approve). */
.preset { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }
.preset:hover { border-color: var(--line-strong); }
.preset[aria-checked="true"] { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 9%, var(--surface)); }
.preset .dot { width: 19px; height: 19px; flex: none; margin-top: 1px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: var(--surface); display: flex; align-items: center; justify-content: center; }
.preset[aria-checked="true"] .dot { border-color: var(--primary); }
.preset[aria-checked="true"] .dot::after { content: ''; width: 9px; height: 9px; border-radius: 999px; background: var(--primary); }
.preset[aria-disabled="true"] { cursor: default; }

/* Desktop side panel for a person (version B). */
.side-scrim { position: fixed; inset: var(--proto-bar) 0 0 0; z-index: 90; background: var(--bg-modal); }
.side-panel { position: fixed; top: var(--proto-bar); right: 0; bottom: 0; z-index: 91; width: 480px; max-width: 100vw; background: var(--elevated); border-left: 1px solid var(--line); box-shadow: var(--shadow-md); display: flex; flex-direction: column; }
.side-panel .body, .sheet .body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
.side-panel .body::-webkit-scrollbar, .sheet .body::-webkit-scrollbar { display: none; }

/* Phone bottom sheet (same look as BottomSheet.tsx). */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 91; max-height: 92dvh; background: var(--elevated); border-radius: 20px 20px 0 0; box-shadow: var(--shadow-md); display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }

.skeleton { background: var(--surface-2); border-radius: 8px; }
.row-btn { width: 100%; text-align: left; background: transparent; border: 0; cursor: pointer; }
.row-btn:hover { background: var(--surface-2); }
.tabular { font-variant-numeric: tabular-nums; }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
html.proto-locked, html.proto-locked body { height: 100%; overflow: hidden; }
html.proto-locked #root { height: calc(100dvh - var(--proto-bar)); overflow: hidden; }
@media (max-width: 767px) { .tap { min-height: 44px; } .rule-title, .rule-sub { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; overflow-wrap: anywhere; } }
@media (min-width: 768px) { .rule-title, .rule-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } }
/* Phones: the shared Switch keeps its look but gets a 44px tap area. */
@media (max-width: 767px) { [role="switch"]::before { content: ''; position: absolute; inset: -9px -4px; } }
.modal-wrap { position: fixed; inset: var(--proto-bar) 0 0 0; z-index: 90; display: flex; align-items: center; justify-content: center; padding: 24px; }
.modal-wrap .side-scrim { position: absolute; inset: 0; z-index: 0; }
.modal-box { position: relative; z-index: 1; display: flex; flex-direction: column; width: 100%; max-width: 560px; max-height: calc(100dvh - var(--proto-bar) - 48px); background: var(--elevated); border: 1px solid var(--line-strong); border-radius: 18px; box-shadow: var(--shadow-md); overflow: hidden; }
.modal-box .body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
.preset[data-pending="true"] { border: 1.5px dashed var(--primary); }
.preset[data-pending="true"] .dot { border-color: var(--primary); }
</style>

<style>
/* #109 prototype: layout helpers and the new phone pieces this design proposes. Colours are tokens. */
.page-sticky { position: sticky; z-index: 20; top: var(--proto-bar); }
@media (max-width: 767px) { .page-sticky { top: calc(var(--proto-bar) + 56px); } }
.proto-pad-bottom { padding-bottom: 96px; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
.cap { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.wrap2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }

/* Budget amount buttons (same look as the year grid's cells). */
.amt { min-width: 64px; text-align: right; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); font-weight: 600; cursor: pointer; }
.amt:hover { border-color: var(--primary); }
.amt[disabled], .amt.locked { border-color: transparent; background: transparent; color: var(--text-3); cursor: default; font-weight: 500; }
@media (max-width: 767px) { .amt { min-height: 44px; } }
.amt-d { min-width: 64px; text-align: right; font-size: 14px; padding: 6px 10px; border-radius: 8px; font-weight: 400; }

/* Version C: pinned first column, months scroll sideways with an edge fade. */
.hwrap { position: relative; }
.hscroll { overflow-x: auto; scrollbar-width: thin; overscroll-behavior-x: contain; }
.hscroll table { border-collapse: separate; border-spacing: 0; }
.hscroll .pin { position: sticky; left: 0; z-index: 2; background: var(--surface); box-shadow: 1px 0 0 var(--line); }
.hscroll .pin.alt, .hscroll tr.alt .pin { background: var(--surface-2); }
.hfade { position: absolute; top: 0; bottom: 0; right: 0; width: 36px; pointer-events: none; background: linear-gradient(to right, transparent, var(--surface)); transition: opacity .15s; z-index: 3; border-radius: 0 18px 18px 0; }
.hwrap[data-end="true"] .hfade { opacity: 0; }

/* Version B: a row's months as a 4-column grid. */
.mgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.mcell { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); min-height: 52px; text-align: right; }
button.mcell { cursor: pointer; }
button.mcell:hover { border-color: var(--primary); }
.mcell.locked { border-color: var(--line); background: var(--surface-2); }
.mcell.cur { box-shadow: inset 0 0 0 1.5px var(--primary); }
.mcell .ml { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
.mcell .mv { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--text); }
.mcell.locked .mv { color: var(--text-3); font-weight: 500; }
.mcell.peak .mv { font-weight: 800; }

/* Recurring calendar on phones: day dots and a selected-day list. */
.cal7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cday { min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; padding-top: 6px; border-radius: 12px; border: 1.5px solid transparent; background: transparent; cursor: pointer; color: var(--text); }
.cday:hover { background: var(--surface-2); }
.cday .n { font-size: 15px; font-weight: 600; line-height: 22px; width: 26px; height: 22px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
.cday.today .n { color: var(--primary); font-weight: 800; }
.cday[aria-pressed="true"] { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, transparent); }
.cday .dots { display: flex; gap: 3px; height: 6px; align-items: center; }
.cday .dots i { width: 6px; height: 6px; border-radius: 999px; display: block; }
.cday .more { font-size: 9px; line-height: 6px; color: var(--text-3); font-weight: 700; }

/* Selection mode and pinned bars on phones. */
.tick { width: 24px; height: 24px; flex: none; border-radius: 7px; border: 1.5px solid var(--line-strong); background: var(--surface); display: flex; align-items: center; justify-content: center; }
.tick[data-on="true"] { border-color: var(--primary); background: var(--primary); color: var(--on-primary); }
.pinbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: var(--surface); border-top: 1px solid var(--line); box-shadow: var(--shadow-md); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
.qr { background: #fff; padding: 10px; border-radius: 12px; border: 1px solid var(--line); display: inline-block; }
.code-box { width: 44px; height: 52px; border-radius: 11px; border: 1.5px solid var(--line-strong); background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
.code-box.err { border-color: var(--negative); }
.drill-pill { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 40; }
@media (max-width: 767px) { .drill-pill { bottom: 16px; width: calc(100vw - 24px); } }
.proto-note { border: 1.5px dashed var(--warning); border-radius: 10px; padding: 8px 12px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: var(--text-2); background: color-mix(in srgb, var(--warning) 8%, transparent); }
#auth { min-height: calc(100dvh - var(--proto-bar)); }
html.proto-auth #root { display: none; }
html:not(.proto-auth) #auth { display: none; }

</style>

<body>
<div id="proto-bar" role="region" aria-label="Prototype controls"></div>

const miniToggle = (opts, active) => `<div class="flex bg-surface-2 border border-line rounded-[10px] p-[3px]">${opts.map((o) => `<button type="button" aria-pressed="${o === active}" class="tap px-3 h-8 rounded-[8px] text-[13px] font-semibold ${o === active ? 'text-content' : 'text-content-3'}" style="${o === active ? 'background:var(--elevated);box-shadow:var(--shadow-sm)' : ''}">${o}</button>`).join('')}</div>`;
const tile = (e, compact) => `<span aria-hidden="true" class="shrink-0 rounded-[8px] bg-surface-2 border border-line flex items-center justify-center leading-none ${compact ? 'w-6 h-6 text-[13px]' : 'w-7 h-7 text-[15px]'}">${e}</span>`;
const chev = (open, label, act) => `<button type="button" aria-label="${label}" aria-expanded="${open}" data-act="${act}" class="tap shrink-0 w-8 h-8 -m-1 flex items-center justify-center rounded-full text-content-3 hover:text-content hover:bg-surface-2"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(${open ? 90 : 0}deg);transition:transform .15s" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>`;
const iconBtn = (icon, label, act = '') => `<button type="button" aria-label="${label}" title="${label}" ${act ? `data-act="${act}"` : ''} class="tap w-10 h-10 rounded-[11px] bg-surface border border-line-strong text-content-2 flex items-center justify-center hover:bg-surface-2">${icon}</button>`;
const stickyBar = (left, right) => `<div class="page-sticky -mt-4 md:-mt-7 -mx-4 md:-mx-8 px-4 md:px-8 py-3 md:py-4 mb-5 md:mb-6 bg-bg border-b border-line flex items-center justify-between gap-3 md:gap-4">${left}${right}</div>`;
const desktopTitle = (t, extra = '') => `<div class="flex items-center gap-2.5 min-w-0"><h1 class="text-[22px] font-extrabold text-content tracking-tight leading-tight m-0">${t}</h1>${extra}</div>`;
const lockedNote = (t) => `<div class="flex items-center gap-1.5 text-[13px] text-content-3">${X.lock}<span>${t}</span></div>`;

// ================= Budget Year =================
function budgetPage(phone) {
  const yr = ui.year;
  const yearNav = `<div class="flex items-center gap-1">${iconBtn(X.chevL, 'Previous year')}<h1 class="text-[22px] font-extrabold tracking-tight text-content m-0 px-1 num">${yr}</h1>${iconBtn(X.chevR18, 'Next year')}</div>`;
  const tools = `<div class="flex items-center gap-2 md:gap-2.5 ${phone ? 'w-full justify-end' : ''}"><button type="button" class="tap h-10 px-4 rounded-[11px] bg-surface border border-line-strong text-content font-semibold text-sm hover:bg-surface-2">Today</button>${seg([['m', 'Month'], ['y', 'Year']], 'y')}</div>`;
  const head = stickyBar(phone ? '' : yearNav, tools);
  if (ui.loading) return head + budgetLoading(phone);
  if (ui.error) return head + `<div class="bg-surface border border-line rounded-[18px] shadow-sm p-6 md:p-10 flex flex-col items-center text-center gap-3"><div class="text-[17px] font-extrabold text-content">Couldn’t load your budget</div><p class="text-sm text-content-3 m-0 max-w-[360px]">Check your connection, then try again. Nothing you planned was lost.</p><button type="button" data-act="retry" class="${btnSecondary} tap mt-1">Try again</button></div>`;
  const empty = yr === 2027 ? `<div class="mb-4">${quiet(`Nothing planned for ${yr} yet.`)}</div>` : '';
  const member = !canEditBudget() ? `<div class="mb-4">${lockedNote('You can view this budget. Ask an admin if you need to change it.')}</div>` : '';
  if (!phone) return head + empty + member + budgetDesktop();
  return head + empty + member + (VERSION === 'a' ? budgetA() : VERSION === 'b' ? budgetB() : budgetC());
}
function budgetLoading(phone) {
  const row = (w) => `<div class="flex items-center justify-between gap-4 px-4 md:px-6 py-3.5 border-b border-line"><div class="skeleton h-4" style="width:${w}px"></div><div class="flex gap-3">${Array.from({ length: phone ? 2 : 8 }, () => '<div class="skeleton h-4 w-14"></div>').join('')}</div></div>`;
  return `<div class="bg-surface border border-line rounded-[18px] shadow-sm overflow-hidden" aria-busy="true" aria-label="Loading budget"><div class="bg-surface-2 border-b border-line h-11"></div>${[150, 110, 170, 90, 140, 120, 160, 100].map(row).join('')}</div>`;
}
const vals = (sub) => ui.year === 2027 ? MON.map(() => 0) : sub.months;
const lockedMonth = (m) => ui.year === 2026 && m < CUR;
const cellBtn = (sub, m, cls = 'amt') => {
  const v = vals(sub)[m];
  const locked = lockedMonth(m) || !canEditBudget();
  const label = `${sub.name}, ${MONTH_FULL[m]} ${ui.year}: ${whole(v) === '—' ? 'nothing planned' : whole(v)}`;
  return locked ? `<span class="${cls} locked inline-block" aria-label="${esc(label)}">${whole(v)}</span>` : `<button type="button" class="${cls}" data-act="editbudget:${sub.id}:${m}" aria-label="${esc(label)}. Edit">${whole(v)}</button>`;
};
const groupVals = (g) => MON.map((_, m) => g.subRows.reduce((a, s) => a + vals(s)[m], 0));
const sectionVals = (s) => MON.map((_, m) => s.groups.reduce((a, g) => a + groupVals(g)[m], 0));

// A: one month at a time.
function budgetA() {
  const m = ui.month;
  const mm = MON[m];
  const switcher = `<div class="flex items-center justify-between gap-2 px-2 py-2 border-b border-line"><button type="button" data-act="month:-1" aria-label="Previous month" ${m === 0 ? 'disabled' : ''} class="tap w-11 h-11 rounded-full flex items-center justify-center text-content-2 hover:bg-surface-2 disabled:opacity-30">${X.chevL}</button><div class="text-center" aria-live="polite"><div class="text-[16px] font-extrabold text-content">${MONTH_FULL[m]} ${ui.year}</div><div class="text-[12px] text-content-3">${lockedMonth(m) ? 'Past month · locked' : m === CUR && ui.year === 2026 ? 'This month' : 'Planned'}</div></div><button type="button" data-act="month:1" aria-label="Next month" ${m === 11 ? 'disabled' : ''} class="tap w-11 h-11 rounded-full flex items-center justify-center text-content-2 hover:bg-surface-2 disabled:opacity-30">${X.chevR18}</button></div>`;
  const cols = (a, b) => `<div class="w-[84px] shrink-0 text-right">${a}</div><div class="w-[76px] shrink-0 text-right">${b}</div>`;
  let h = `<div class="flex items-center gap-2 px-4 py-2 bg-surface-2 border-b border-line"><div class="flex-1 cap">Category</div>${cols(`<span class="cap" style="color:var(--primary);font-weight:700">${mm}</span>`, '<span class="cap">Year</span>')}</div>`;
  BUDGET.forEach((s) => {
    const sv = sectionVals(s);
    h += `<div class="flex items-center gap-2 px-4 py-2.5 bg-surface-2 border-b border-line"><div class="flex-1 text-xs font-bold uppercase tracking-wide text-content-2">${s.section}</div>${cols(`<span class="text-[15px] font-bold num text-content-2">${whole(sv[m])}</span>`, `<span class="text-[15px] font-bold num text-content-2">${whole(yearOf(sv))}</span>`)}</div>`;
    s.groups.forEach((g) => {
      const gv = groupVals(g); const open = ui.open.has(g.id);
      h += `<div class="flex items-center gap-2 px-4 py-2.5 border-b border-line min-h-[52px]"><div class="flex-1 min-w-0 flex items-center gap-2.5">${chev(open, open ? `Collapse ${g.name}` : `Expand ${g.name}`, 'group:' + g.id)}${tile(g.tile, true)}<span class="font-bold text-[15px] text-content wrap2">${g.name}</span></div>${cols(`<span class="text-[15px] font-semibold num text-content">${whole(gv[m])}</span>`, `<span class="text-[15px] font-semibold num text-content-2">${whole(yearOf(gv))}</span>`)}</div>`;
      if (open) g.subRows.forEach((sub) => {
        h += `<div class="flex items-center gap-2 pl-[52px] pr-4 py-1.5 border-b border-line min-h-[56px]"><div class="flex-1 min-w-0 flex items-center gap-2"><span class="shrink-0 text-[15px] leading-none" aria-hidden="true">${sub.emoji}</span><span class="text-[15px] text-content-2 wrap2">${sub.name}</span></div>${cols(cellBtn(sub, m), `<span class="text-[15px] num text-content-3">${whole(yearOf(vals(sub)))}</span>`)}</div>`;
      });
    });
  });
  return `<div class="bg-surface border border-line rounded-[18px] shadow-sm overflow-hidden">${switcher}${h}</div>`;
}

// B: one row per category with its year total; tap a row for its months.
function monthsGrid(sub) {
  return `<div class="mgrid px-4 pt-1 pb-4" role="group" aria-label="${esc(sub.name)} by month">${MON.map((mm, m) => {
    const v = vals(sub)[m]; const locked = lockedMonth(m) || !canEditBudget(); const cur = m === CUR && ui.year === 2026;
    const inner = `<span class="ml">${mm}</span><span class="mv">${whole(v)}</span>`;
    const label = `${sub.name}, ${MONTH_FULL[m]}: ${v ? whole(v) : 'nothing planned'}`;
    return locked ? `<div class="mcell locked ${cur ? 'cur' : ''}" aria-label="${esc(label)}">${inner}</div>` : `<button type="button" class="mcell ${cur ? 'cur' : ''}" data-act="editbudget:${sub.id}:${m}" aria-label="${esc(label)}. Edit">${inner}</button>`;
  }).join('')}</div>`;
}
const rowToggle = (id, open, label) => `data-act="months:${id}" aria-expanded="${open}" aria-label="${esc(label)}"`;
const bChev = (open) => `<span class="shrink-0 text-content-3 flex" style="transform:rotate(${open ? 180 : 0}deg);transition:transform .15s">${I.chevD}</span>`;
function budgetB() {
  let h = `<div class="flex items-center gap-2 px-4 py-2 bg-surface-2 border-b border-line"><div class="flex-1 cap">Category</div><div class="cap text-right pr-7">${ui.year} total</div></div>`;
  BUDGET.forEach((s) => {
    const sv = sectionVals(s);
    h += `<div class="flex items-center gap-2 px-4 py-2.5 bg-surface-2 border-b border-line"><div class="flex-1 text-xs font-bold uppercase tracking-wide text-content-2">${s.section}</div><span class="text-[15px] font-bold num text-content-2 pr-7">${whole(yearOf(sv))}</span></div>`;
    s.groups.forEach((g) => {
      const gv = groupVals(g); const open = ui.open.has(g.id);
      h += `<div class="flex items-center gap-2 px-4 py-2.5 border-b border-line min-h-[52px]"><div class="flex-1 min-w-0 flex items-center gap-2.5">${chev(open, open ? `Collapse ${g.name}` : `Expand ${g.name}`, 'group:' + g.id)}${tile(g.tile, true)}<span class="font-bold text-[15px] text-content wrap2">${g.name}</span></div><span class="text-[15px] font-semibold num text-content pr-7">${whole(yearOf(gv))}</span></div>`;
      if (open) g.subRows.forEach((sub) => {
        const mo = ui.months.has(sub.id);
        h += `<div class="border-b border-line ${mo ? 'bg-surface-2/40' : ''}"><button type="button" class="row-btn flex items-center gap-2 pl-[52px] pr-4 py-2 min-h-[52px]" ${rowToggle(sub.id, mo, `${sub.name}, ${ui.year} total ${whole(yearOf(vals(sub)))}. ${mo ? 'Hide' : 'Show'} months`)}><span class="shrink-0 text-[15px] leading-none" aria-hidden="true">${sub.emoji}</span><span class="flex-1 min-w-0 text-[15px] text-content-2 wrap2">${sub.name}</span><span class="text-[15px] num text-content font-semibold">${whole(yearOf(vals(sub)))}</span>${bChev(mo)}</button>${mo ? monthsGrid(sub) : ''}</div>`;
      });
    });
  });
  return `<div class="bg-surface border border-line rounded-[18px] shadow-sm overflow-hidden">${h}</div>`;
}

// C: the grid stays; the category column is pinned and months scroll sideways.
function budgetC() {
  const W = 84;
  const curBg = 'background:color-mix(in srgb, var(--primary) 12%, transparent)';
  const th = MON.map((mm, m) => `<th scope="col" class="cap text-right px-2 py-3" style="min-width:${W}px;${m === CUR && ui.year === 2026 ? curBg + ';color:var(--primary);font-weight:800' : ''}">${mm}</th>`).join('');
  let rows = '';
  BUDGET.forEach((s) => {
    const sv = sectionVals(s);
    rows += `<tr class="alt"><th scope="row" class="pin alt text-left px-4 py-2.5 text-xs font-bold uppercase tracking-wide text-content-2 border-b border-line">${s.section}</th>${sv.map((v, m) => `<td class="text-right px-3 py-2.5 text-[15px] font-bold num text-content-2 bg-surface-2 border-b border-line" style="${m === CUR && ui.year === 2026 ? curBg : ''}">${whole(v)}</td>`).join('')}</tr>`;
    s.groups.forEach((g) => {
      const gv = groupVals(g); const open = ui.open.has(g.id);
      rows += `<tr><th scope="row" class="pin text-left px-3 py-2 border-b border-line font-normal"><div class="flex items-center gap-1.5">${chev(open, open ? `Collapse ${g.name}` : `Expand ${g.name}`, 'group:' + g.id)}<span class="font-bold text-[14px] text-content wrap2 leading-tight">${g.name}</span></div></th>${gv.map((v, m) => `<td class="text-right px-3 py-2 text-[15px] font-semibold num text-content border-b border-line" style="${m === CUR && ui.year === 2026 ? curBg : ''}">${whole(v)}</td>`).join('')}</tr>`;
      if (open) g.subRows.forEach((sub) => {
        rows += `<tr><th scope="row" class="pin text-left pl-4 pr-2 py-1.5 border-b border-line font-normal"><div class="flex items-center gap-1.5"><span class="shrink-0 text-[14px] leading-none" aria-hidden="true">${sub.emoji}</span><span class="text-[14px] text-content-2 wrap2 leading-tight">${sub.name}</span></div></th>${MON.map((_, m) => `<td class="text-right px-1.5 py-1.5 border-b border-line" style="${m === CUR && ui.year === 2026 ? curBg : ''}">${cellBtn(sub, m)}</td>`).join('')}</tr>`;
      });
    });
  });
  return `<div class="bg-surface border border-line rounded-[18px] shadow-sm overflow-hidden hwrap" data-hscroll="budget"><div class="hscroll" tabindex="0" aria-label="Budget ${ui.year}, months scroll sideways"><table class="w-full"><thead><tr class="bg-surface-2"><th scope="col" class="pin alt cap text-left px-4 py-3 border-b border-line" style="width:140px;min-width:140px;max-width:140px">Category</th>${th.replace(/<th /g, '<th class="border-b border-line" ').replace(/class="border-b border-line" scope="col" class="/g, 'scope="col" class="border-b border-line bg-surface-2 ')}</tr></thead><tbody>${rows}</tbody></table></div><div class="hfade" aria-hidden="true"></div></div><p class="text-[12px] text-content-3 mt-2 mb-0 text-center">Swipe sideways for other months</p>`;
}

// Desktop: today's year grid, unchanged.
function budgetDesktop() {
  const curBg = 'background:color-mix(in srgb, var(--primary) 12%, transparent)';
  const bg = (m) => m === CUR && ui.year === 2026 ? curBg : 'background:transparent';
  let h = `<div class="flex items-center border-b border-line bg-surface-2"><div class="w-[250px] shrink-0 px-6 py-3 cap">Category</div>${MON.map((mm, m) => `<div class="flex-1 min-w-0 px-3 py-3 text-right mono text-[11px] uppercase tracking-wide" style="${m === CUR && ui.year === 2026 ? 'color:var(--primary);font-weight:800;' + curBg : 'color:var(--text-3);font-weight:600'}">${mm} ${ui.year}</div>`).join('')}</div>`;
  BUDGET.forEach((s) => {
    const sv = sectionVals(s);
    h += `<div class="flex items-center border-b border-line bg-surface-2"><div class="w-[250px] shrink-0 px-6 py-2.5 text-xs font-bold uppercase tracking-wide text-content-2">${s.section}</div>${sv.map((v, m) => `<div class="flex-1 min-w-0 px-3 py-2.5 text-right text-xs font-bold text-content-2 num" style="${bg(m)}">${whole(v)}</div>`).join('')}</div>`;
    s.groups.forEach((g) => {
      const gv = groupVals(g); const open = ui.open.has(g.id);
      h += `<div class="flex items-center border-b border-line"><div class="w-[250px] shrink-0 px-6 py-3 flex items-center gap-2.5">${chev(open, open ? 'Collapse' : 'Expand', 'group:' + g.id)}${tile(g.tile, true)}<span class="font-bold text-sm truncate">${g.name}</span></div>${gv.map((v, m) => `<div class="flex-1 min-w-0 px-3 py-3 text-right text-sm font-semibold num" style="${bg(m)}">${whole(v)}</div>`).join('')}</div>`;
      if (open) g.subRows.forEach((sub) => {
        h += `<div class="flex items-center border-b border-line"><div class="w-[250px] shrink-0 px-6 py-2.5 text-sm text-content-2 flex items-center gap-1.5" style="padding-left:52px"><span class="shrink-0 text-[15px] leading-none">${sub.emoji}</span><span class="truncate">${sub.name}</span></div>${MON.map((_, m) => `<div class="flex-1 min-w-0 px-2.5 py-1.5 flex justify-end" style="${bg(m)}">${cellBtn(sub, m, 'amt amt-d')}</div>`).join('')}</div>`;
      });
    });
  });
  return `<div class="bg-surface rounded-[18px] border border-line shadow-sm overflow-x-auto">${h}</div>`;
}

// ================= Reports: Category breakdown → Timeline =================
function timelinePage(phone) {
  const R = RANGES[ui.range];
  const data = tlRows(ui.range);
  const inc = tsum(data[0].groups[0].vals); const exp = data[1].groups.reduce((a, g) => a + tsum(g.vals), 0);
  const left = phone ? '' : desktopTitle('Reports');
  const right = `<div class="flex items-center gap-2 ${phone ? 'w-full' : ''}"><button type="button" class="tap h-10 px-3.5 rounded-[11px] bg-surface border border-line-strong text-content font-semibold text-sm flex items-center gap-2 ${phone ? 'flex-1 min-w-0 justify-between' : ''}"><span class="flex items-center gap-2 min-w-0">${X.cal}<span class="truncate">${R.label}</span></span>${I.chevD}</button>${phone ? '' : '<button type="button" class="tap h-10 px-3.5 rounded-[11px] bg-surface border border-line-strong text-content-2 font-semibold text-sm">Clear</button>'}${iconBtn(X.filter, 'Filters')}${iconBtn(X.download, 'Export')}</div>`;
  const kpi = (l, v, c = '') => `<div class="bg-surface border border-line rounded-[18px] shadow-sm p-4 md:p-5"><div class="cap">${l}</div><div class="text-[22px] md:text-[28px] font-extrabold tracking-tight num mt-1" style="${c}">${v}</div></div>`;
  const kpis = `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 mb-4 md:mb-6">${kpi('Income', `+${tmoney(inc)}`, 'color:var(--positive)')}${kpi('Expenses', tmoney(exp))}${kpi('Net', `+${tmoney(inc - exp)}`, 'color:var(--positive)')}${kpi('Savings rate', `${Math.round((1 - exp / inc) * 100)}%`)}</div>`;
  const hint = `Totals by ${R.unit} · ${phone ? 'tap' : 'click'} a category to drill in`;
  const header = `<div class="flex ${phone ? 'flex-col items-stretch' : 'items-center justify-between'} gap-3 px-4 md:px-[26px] py-4 md:py-[18px] border-b border-line"><div class="min-w-0"><div class="text-[17px] md:text-[19px] font-extrabold tracking-tight text-content">Category breakdown</div><div class="text-[13px] text-content-3 mt-0.5">${hint}</div></div><div class="flex items-center ${phone ? 'justify-between' : ''} gap-2"><button type="button" class="tap h-9 px-3 rounded-[10px] text-[13px] font-semibold text-content-2 hover:bg-surface-2" data-act="expandall">${ui.allOpen ? 'Collapse all' : 'Expand all'}</button>${miniToggle(['Summary', 'Timeline'], 'Timeline')}</div></div>`;
  let body;
  const sections = ui.drill ? [{ section: ui.drill, groups: data[1].groups.find((g) => g.name === ui.drill).subs.map((s) => ({ ...s, color: null, subs: [] })) }] : data;
  if (!phone) body = tlDesktop(sections, R);
  else body = VERSION === 'a' ? tlA(sections, R) : VERSION === 'b' ? tlB(sections, R) : tlC(sections, R);
  const pill = ui.drill ? drillPill(data, exp) : '';
  return stickyBar(left, right) + kpis + `<div class="bg-surface border border-line rounded-[18px] shadow-sm overflow-hidden ${phone && VERSION === 'c' ? '' : ''}">${header}${body}</div>${ui.drill ? '<div class="h-24"></div>' : ''}${pill}`;
}
function drillPill(data, exp) {
  const g = data[1].groups.find((x) => x.name === ui.drill); const t = tsum(g.vals);
  return `<div class="drill-pill flex items-center gap-3 pl-5 pr-2 h-14 rounded-full bg-elevated shadow-md" style="border:2px solid var(--primary)"><div class="flex-1 min-w-0 flex items-center gap-2 text-[14px] font-semibold text-content"><span class="truncate">Expenses › ${g.name}</span></div><span class="text-[14px] font-bold num text-content shrink-0">${tmoney(t)}</span><span class="text-[13px] text-content-3 num shrink-0 hidden sm:inline">· ${Math.round(t / exp * 100)}% of expenses</span><button type="button" data-act="cleardrill" title="Clear drill-down" aria-label="Clear drill-down" class="tap w-10 h-10 rounded-full flex items-center justify-center shrink-0" style="background:var(--negative);color:var(--on-primary)">${svg('<path d="M6 6l12 12M18 6 6 18"/>', 16, 2.6)}</button></div>`;
}
const tlRowsFlat = (sections, fn) => sections.map((s) => fn.section(s) + s.groups.map((g) => fn.group(g) + (g.subs.length && (ui.open.has(g.id) || ui.allOpen) ? g.subs.map(fn.sub).join('') : '')).join('')).join('');
const peakIdx = (v) => v.indexOf(Math.max(...v));
const sq = (c) => c ? `<span aria-hidden="true" class="w-3.5 h-3.5 rounded-[4px] shrink-0" style="background:${c}"></span>` : '';

function tlA(sections, R) {
  const b = ui.bucket;
  const n = R.buckets.length;
  const switcher = `<div class="flex items-center justify-between gap-2 px-2 py-2 border-b border-line"><button type="button" data-act="bucket:-1" aria-label="Previous ${R.unit}" ${b === 0 ? 'disabled' : ''} class="tap w-11 h-11 rounded-full flex items-center justify-center text-content-2 hover:bg-surface-2 disabled:opacity-30">${X.chevL}</button><div class="text-center" aria-live="polite"><div class="text-[16px] font-extrabold text-content">${R.long[b]}</div><div class="text-[12px] text-content-3">${b + 1} of ${n} · ${R.label}</div></div><button type="button" data-act="bucket:1" aria-label="Next ${R.unit}" ${b === n - 1 ? 'disabled' : ''} class="tap w-11 h-11 rounded-full flex items-center justify-center text-content-2 hover:bg-surface-2 disabled:opacity-30">${X.chevR18}</button></div>`;
  const cols = (a, c) => `<div class="w-[80px] shrink-0 text-right">${a}</div><div class="w-[84px] shrink-0 text-right">${c}</div>`;

// A fake QR drawn from sample bits (never a real secret).
function fakeQr(size = 168) {
  const N = 25; let r = '';
  const finder = (x, y) => (x < 7 && y < 7) || (x >= N - 7 && y < 7) || (x < 7 && y >= N - 7);
  const ring = (x, y, ox, oy) => { const dx = x - ox, dy = y - oy; const m = Math.max(Math.abs(dx - 3), Math.abs(dy - 3)); return m === 3 || m <= 1; };
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let on;
    if (finder(x, y)) on = ring(x, y, x >= N - 7 ? N - 7 : 0, y >= N - 7 ? N - 7 : 0);
    else on = rnd(x * 31 + y * 17) > 0.52;
    if (on) r += `<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`;
  }
  return `<span class="qr"><svg width="${size}" height="${size}" viewBox="0 0 ${N} ${N}" fill="black" role="img" aria-label="QR code for Ledger (sample)">${r}</svg></span>`;
}

  const mapSel = (l, v) => `<div><div class="text-xs text-content-3 mb-1.5">${l}</div>${selectShell(`<select class="w-full h-11 pl-3.5 pr-[38px] bg-elevated border border-line-strong rounded-[11px] text-content font-semibold text-sm appearance-none"><option>${v}</option></select>`)}</div>`;
  const mapping = `<div class="border border-line rounded-[14px] bg-surface-2 p-4 md:p-5 mt-[22px]"><div class="font-bold text-sm mb-4 text-content">Column mapping</div><div class="grid grid-cols-1 sm:grid-cols-3 gap-4">${mapSel('Date', 'Date')}${mapSel('Description', 'Description')}${mapSel('Amount', 'Amount')}</div></div>`;
  const SIGNS = [['in', 'Positive = money in, negative = money out', 'Standard for bank accounts (checking, savings).'], ['out', 'Positive = money out, negative = money in', 'Common for credit card statements.']];
  const signs = phone
    ? `<div class="flex flex-col gap-2.5" role="radiogroup" aria-label="Amount sign convention">${SIGNS.map(([k, l, h]) => `<button type="button" role="radio" aria-checked="${ui.sign === k}" data-act="sign:${k}" class="preset tap"><span class="dot"></span><span class="flex-1 min-w-0"><span class="block text-[14px] font-semibold text-content">${l}</span><span class="block text-[12.5px] text-content-3 mt-0.5">${h}</span></span></button>`).join('')}</div>`
    : `<div class="flex gap-2.5 flex-wrap">${SIGNS.map(([k, l]) => `<button type="button" data-act="sign:${k}" aria-pressed="${ui.sign === k}" class="h-10 px-[18px] rounded-[11px] flex items-center text-[13.5px] font-semibold" style="${ui.sign === k ? 'background:var(--primary);color:var(--on-primary);border:1px solid var(--primary)' : 'background:var(--elevated);color:var(--text-2);border:1px solid var(--line-strong)'}">${l}</button>`).join('')}</div><div class="text-[12.5px] text-content-3 mt-3">${SIGNS.find((s) => s[0] === ui.sign)[2]}</div>`;
  const signBox = `<div class="border border-line rounded-[14px] bg-surface-2 p-4 md:p-5 mt-4"><div class="font-bold text-sm mb-3.5 text-content">Amount sign convention</div>${signs}</div>`;
  const amt = (a) => ui.sign === 'out' ? -a : a; // flipping the convention flips how each row reads
  const preview = phone
    ? `<div class="border border-line rounded-[12px] overflow-hidden">${PREVIEW.map(([, d, m, a]) => `<div class="flex items-start gap-3 px-3.5 py-3 border-b border-line last:border-b-0"><div class="flex-1 min-w-0"><div class="text-[14px] font-semibold text-content wrap2">${m}</div><div class="text-[12.5px] text-content-3 mt-0.5">${d} · John’s Checking</div></div>${money(amt(a), 'text-[15px] font-bold shrink-0')}</div>`).join('')}</div>`
    : `<div class="overflow-x-auto border border-line rounded-[12px]"><div class="min-w-[900px]"><div class="flex items-center gap-3.5 px-4 py-[11px] border-b border-line bg-surface-2 font-mono text-[10.5px] tracking-[0.05em] uppercase text-content-3"><span class="w-[88px] flex-none">Date</span><span class="w-[150px] flex-none">Merchant</span><span class="w-[130px] flex-none">Category</span><span class="w-[150px] flex-none">Account</span><span class="flex-1 min-w-0">Original statement</span><span class="w-[100px] flex-none text-right">Amount</span><span class="w-[70px] flex-none">Owner</span></div>${PREVIEW.map(([iso, , m, a]) => `<div class="flex items-center gap-3.5 px-4 py-3 border-b border-line text-[12.5px] last:border-b-0"><span class="w-[88px] flex-none font-mono text-content-3">${iso}</span><span class="w-[150px] flex-none font-semibold truncate text-content">${m}</span><span class="w-[130px] flex-none text-content-2">—</span><span class="w-[150px] flex-none font-mono text-[11px] text-content-3 truncate">John's Checking ····4821</span><span class="flex-1 min-w-0 font-mono text-[11px] text-content-3 truncate">${m}</span><span class="min-w-[100px] flex-none text-right font-mono font-semibold">${money(amt(a))}</span><span class="w-[70px] flex-none text-content-3">John</span></div>`).join('')}</div></div>`;
  const backNext = (cls) => `<button type="button" data-act="importback" class="${btnSecondary} tap ${cls}">${X.chevL}Back</button><button type="button" data-act="importnext" class="${btnPrimary} tap ${cls}">Next${X.chevR18}</button>`;
  const top = phone ? '' : `<div class="flex items-start justify-between gap-4 mb-1.5"><button type="button" data-act="importback" class="inline-flex items-center gap-[7px] text-[13px] font-semibold text-primary">${X.chevL}Back</button><button type="button" data-act="importnext" class="h-12 px-[22px] rounded-[11px] bg-primary text-on-primary font-bold text-sm flex items-center gap-2">Next${X.chevR18}</button></div>`;
  const body = `<div class="border border-line rounded-[16px] bg-surface p-4 md:p-6 shadow-sm">${top}<div class="text-[19px] font-extrabold tracking-[-0.01em] text-content" style="overflow-wrap:anywhere">sample-checking.csv</div><div class="font-mono text-[12.5px] text-content-3 mt-1">John's Checking · 6 transactions · Format: generic</div>${mapping}${signBox}<div class="cap mt-6 mb-2.5">Preview · first 5 rows</div>${preview}</div>`;
  const pin = phone ? `<div class="h-24"></div><div class="pinbar"><div class="flex gap-2.5">${backNext('flex-1')}</div></div>` : '';
  return head + importSteps(phone, 2) + body + pin;
}

// ================= Settings: Merchants and Edit merchant =================
const MERCHANTS = [['Larkspindle Finance', 93], ['Target', 75], ['Costco', 66], ['Walmart', 63], ['Pebblewisp Market', 41], ['Mossquill Pet Clinic', 12]];
function merchantsPage(phone) {
  const tools = `<div class="flex items-center justify-between gap-3 flex-wrap mb-4"><button type="button" class="tap inline-flex items-center gap-2 h-10 px-3.5 rounded-[11px] bg-surface border border-line-strong text-content font-semibold text-sm">${X.sort}Transaction count${I.chevD}</button><div class="h-10 flex items-center gap-2 rounded-[11px] bg-surface border border-line-strong px-3.5 w-[320px] max-w-full text-content-3 text-sm">${I.search}Search 185 merchants…</div></div>`;
  const list = card(`<div class="px-4 md:px-6 py-[18px] flex items-baseline gap-2.5"><span class="text-[17px] font-extrabold tracking-tight text-content">All merchants</span><span class="font-mono text-[13px] text-content-3">185</span></div>${MERCHANTS.map(([m, c]) => `<div class="flex items-center gap-4 px-4 md:px-6 h-[68px] border-t border-line">${avatar(m, tone(m), 40)}<div class="flex-1 min-w-0"><div class="font-bold text-[15px] truncate">${m}</div><div class="text-[13px] text-primary mt-0.5">${c} transactions</div></div><button type="button" data-act="openmerchant" class="${btnRow}">${I.pencil}Edit</button></div>`).join('')}`);
  return settingsFrame(phone, 'merchants', 'Merchants', 'Every merchant from your transaction history. Edit how one displays throughout Ledger, set a rule for how it’s categorized, or merge merchants you don’t need.', tools + list);
}
function merchantBody(phone) {
  const m = 'Larkspindle Finance';
  const merge = phone ? `<button type="button" data-act="merge" class="row-btn flex items-center gap-3 mt-1 px-3.5 py-3 rounded-[12px] border" style="border-color:color-mix(in srgb, var(--negative) 35%, var(--line));color:var(--negative)"><span class="shrink-0">${X.merge}</span><span class="flex-1 min-w-0"><span class="block text-[14px] font-bold">Merge &amp; delete</span><span class="block text-[12.5px] text-content-3 mt-0.5 leading-snug">Move its 93 transactions to another merchant, then delete ${m}.</span></span><span class="shrink-0 text-content-3">${I.chevR}</span></button>` : '';
  return `<div class="flex flex-col gap-5"><div class="flex items-center gap-4">${avatar(m, 'var(--c-violet)', 56)}<div class="min-w-0"><button type="button" class="text-[13px] font-semibold text-primary">Upload logo</button><div class="text-[13px] text-content-3 mt-0.5">Shown wherever this merchant appears.</div></div></div>${field('Merchant name', `<input class="${inputCls}" value="${m}">`)}${field('Always categorize as', `<div class="flex items-center gap-2">${selectShell(`<select class="${selectCls}"><option>Interest Income</option></select>`, 'flex-1 min-w-0')}<button type="button" title="Remove this rule" aria-label="Remove this rule" class="w-11 h-11 flex-none flex items-center justify-center rounded-[11px] border border-line-strong bg-surface-2 text-negative">${I.trash}</button></div>`, 'New and existing transactions from this merchant use this category. Clear it to choose per transaction again.')}<button type="button" role="checkbox" aria-checked="false" class="flex items-center gap-3 text-left min-h-[44px]">${checkBox(false)}<span class="text-sm text-content-2">Don’t ask about this merchant when I change a category</span></button>${merge}</div>`;
}

// ================= overlays (bottom sheet on phones, today's modal or side panel on desktop) =================
function overlaySpec(phone) {
  const s = ui.sheet; const n = ui.ticked.size;
  if (!s) return null;
  if (s === 'edit') return { title: phone ? `Edit ${n} transactions` : 'Edit transactions', sub: phone ? '' : `${n} selected`, body: bulkEditBody(), side: true,
    foot: `<button type="button" data-act="closesheet" class="${btnSecondary} flex-1">Cancel</button><button type="button" data-act="apply" ${ui.bulkSet ? '' : 'disabled'} class="${btnPrimary} flex-1">Apply changes</button>` };
  if (s === 'delete') return { title: `Delete ${n} transactions?`, body: `<p class="text-sm text-content-2 m-0 leading-relaxed">The ${n} selected transactions (<span class="num">${cents(selTotal())}</span>) will be removed from Ledger. You can’t undo this.</p>`,
    foot: `<button type="button" data-act="closesheet" class="${btnSecondary} flex-1">Cancel</button><button type="button" data-act="confirmdelete" class="${btnPrimary} flex-1" style="background:var(--negative)">Delete</button>` };
  if (s === 'twofa') return { title: 'Set up two-factor authentication', body: twofaBody(phone),
    foot: `<button type="button" data-act="closesheet" class="${btnSecondary} ${phone ? 'flex-1' : ''}">Cancel</button><button type="button" data-act="verify" ${ui.code.length === 6 ? '' : 'disabled'} class="${btnPrimary} ${phone ? 'flex-1' : ''}">Verify and enable</button>` };
  if (s === 'merchant') return { title: 'Edit merchant', body: merchantBody(phone),
    foot: phone ? `<button type="button" data-act="closesheet" class="${btnSecondary} flex-1">Cancel</button><button type="button" data-act="save" class="${btnPrimary} flex-1">Save changes</button>`
      : `<button type="button" data-act="merge" class="${btnDanger}">Merge &amp; delete</button><div class="ml-auto flex items-center gap-2.5"><button type="button" data-act="closesheet" class="${btnSecondary}">Cancel</button><button type="button" data-act="save" class="${btnPrimary}">Save changes</button></div>` };
  return null;
}
function renderOverlay(phone) {
  const el = document.getElementById('overlay');
  const o = overlaySpec(phone);
  if (!o) { el.innerHTML = ''; return; }
  const wasOpen = !!el.innerHTML;
  const close = `<button type="button" data-act="closesheet" aria-label="Close" class="shrink-0 w-11 h-11 -mr-3 -my-1.5 flex items-center justify-center rounded-[10px] text-content-2 hover:bg-surface-2">${I.x}</button>`;
  const head = (px) => `<div class="flex items-start justify-between gap-3 shrink-0 ${px} pt-1 pb-3 border-b border-line"><div class="min-w-0"><div class="text-[18px] font-extrabold tracking-tight text-content leading-tight">${o.title}</div>${o.sub ? `<div class="text-[13px] text-content-3 mt-1">${o.sub}</div>` : ''}</div>${close}</div>`;
  if (phone) el.innerHTML = `<div class="side-scrim" data-act="closesheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(o.title)}"><div class="flex justify-center shrink-0" style="padding:12px 0 8px"><div class="w-9 h-1 rounded-full bg-line-strong"></div></div>${head('px-5')}<div class="body px-5 py-4">${o.body}</div><div class="shrink-0 px-5 py-3 border-t border-line flex items-center gap-2.5">${o.foot}</div></div>`;
  else if (o.side) el.innerHTML = `<div class="side-scrim" data-act="closesheet"></div><aside class="side-panel" style="width:440px" role="dialog" aria-modal="true" aria-label="${esc(o.title)}"><div class="pt-4">${head('px-6')}</div><div class="body px-6 py-6">${o.body}</div><div class="shrink-0 px-6 py-4 border-t border-line flex items-center gap-2.5">${o.foot}</div></aside>`;
  else el.innerHTML = `<div class="modal-wrap"><div class="side-scrim" data-act="closesheet" style="backdrop-filter:blur(3px)"></div><div class="modal-box" role="dialog" aria-modal="true" aria-label="${esc(o.title)}"><div class="pt-5">${head('px-6')}</div><div class="body px-6 py-5">${o.body}</div><div class="shrink-0 px-6 py-4 border-t border-line flex items-center justify-end gap-2.5">${o.foot}</div></div></div>`;
  if (!wasOpen) el.querySelector('[aria-label="Close"]')?.focus({ preventScroll: true });
}

// ================= shell =================
const SCREENS = {
  budget: { nav: 'Budget', fn: budgetPage }, timeline: { nav: 'Reports', title: 'Reports', fn: timelinePage }, holdings: { nav: 'Investments', title: 'Investments', fn: holdingsPage },
  calendar: { nav: 'Recurring', title: 'Recurring', fn: calendarPage }, tx: { nav: 'Transactions', title: 'Transactions', fn: txPage }, security: { nav: '', title: 'Security', back: true, fn: securityPage },
  import: { nav: 'Import', title: 'Import', fn: importPage }, merchants: { nav: '', title: 'Merchants', back: true, fn: merchantsPage },
};
function render() {
  const phone = isPhone();
  const screen = ui.st.screen;
  document.documentElement.classList.toggle('proto-auth', screen === 'authsetup');
  if (screen === 'authsetup') { document.getElementById('auth').innerHTML = authSetupPage(phone); document.getElementById('overlay').innerHTML = ''; document.documentElement.classList.remove('proto-locked'); return; }
  const S = SCREENS[screen];
  document.querySelectorAll('aside nav a').forEach((a) => {
    const on = !!S.nav && a.textContent.trim().startsWith(S.nav);
    a.className = `flex items-center gap-2.5 rounded-[11px] text-sm no-underline transition-colors ${on ? 'bg-primary/15 text-primary font-semibold' : 'text-content-2 font-medium hover:bg-surface-2 hover:text-content'}`;
    on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
  });
  const title = document.getElementById('mobile-bar-title');
  const back = document.getElementById('mobile-bar-back');
  const actions = document.getElementById('mobile-bar-actions');
  const t = screen === 'budget' ? String(ui.year) : screen === 'tx' && ui.select ? 'Select' : S.title;
  title.innerHTML = `<span class="block truncate text-[17px] font-extrabold tracking-tight text-content num">${t}</span>`;
  back.innerHTML = S.back ? `<button type="button" aria-label="Back to Settings" class="w-10 h-10 rounded-[10px] flex items-center justify-center text-content-2">${I.back}</button>` : '';
  actions.innerHTML = screen === 'budget' ? `<button type="button" aria-label="Previous year">${X.chevL}</button><button type="button" aria-label="Next year">${X.chevR18}</button>` : '';
  document.getElementById('main').innerHTML = S.fn(phone);
  renderOverlay(phone);
  document.documentElement.classList.toggle('proto-locked', !!document.getElementById('overlay').innerHTML);
  setupHScroll();
}
// Version C: scroll to the current month on first render; the edge fade hides at the end.
function setupHScroll() {
  document.querySelectorAll('.hwrap').forEach((w) => {
    const sc = w.querySelector('.hscroll');
    const upd = () => { w.dataset.end = String(sc.scrollLeft + sc.clientWidth >= sc.scrollWidth - 2); };
    if (ui.scrollInit && w.dataset.hscroll === 'budget' && ui.year === 2026) {
      const th = sc.querySelectorAll('thead th')[CUR + 1];
      if (th) sc.scrollLeft = th.offsetLeft - 140 - 84 * 2;
    } else if (ui.scrollInit && w.dataset.hscroll === 'tl') sc.scrollLeft = sc.scrollWidth;
    if (ui.hs && ui.hs[w.dataset.hscroll] != null && !ui.scrollInit) sc.scrollLeft = ui.hs[w.dataset.hscroll];
    sc.onscroll = () => { ui.hs = ui.hs || {}; ui.hs[w.dataset.hscroll] = sc.scrollLeft; upd(); };
    upd();
  });
  ui.scrollInit = false;
}

// ---------- prototype bar ----------
function setTheme(t) { document.documentElement.classList.toggle('dark', t === 'dark'); ui.theme = t; }
function syncUrl() {
  const p = new URLSearchParams(location.search);
  p.set('state', ui.stateName); p.set('theme', ui.theme);
  history.replaceState(null, '', `${location.pathname}?${p}`);
  document.documentElement.dataset.state = ui.stateName;
  document.documentElement.dataset.theme = ui.theme;
}
const VLABEL = { a: 'Version A · Budget Year and Timeline show one month at a time on phones', b: 'Version B · one row per category, tap a row for its months', c: 'Version C · grid with a pinned category column, months scroll sideways' };
function renderBar() {
  document.getElementById('proto-bar').innerHTML = `<span class="tag">Prototype ${VERSION.toUpperCase()}</span><span class="ver">${VLABEL[VERSION]}</span><span class="spacer"></span>
    <label><span class="lbl">State</span><select id="proto-state" aria-label="Prototype state">${STATE_NAMES.map((s) => `<option value="${s}" ${s === ui.stateName ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
    <label><span class="lbl">Theme</span><select id="proto-theme" aria-label="Prototype theme">${THEMES.map((t) => `<option value="${t}" ${t === ui.theme ? 'selected' : ''}>${t}</option>`).join('')}</select></label>`;
  document.getElementById('proto-state').onchange = (e) => { reset(e.target.value); render(); syncUrl(); window.scrollTo(0, 0); };
  document.getElementById('proto-theme').onchange = (e) => { setTheme(e.target.value); render(); syncUrl(); };
}
function toast(msg) {
  const t = document.getElementById('toasts');
  const d = document.createElement('div');
  d.className = 'flex items-center gap-2.5 px-4 py-3 rounded-[12px] bg-elevated border border-line shadow-md text-sm font-semibold text-content';
  d.innerHTML = `<span class="text-positive">${I.check}</span>${esc(msg)}`;
  t.appendChild(d); setTimeout(() => d.remove(), 2600);
}

// ---------- interactions ----------
const subById = (id) => BUDGET.flatMap((s) => s.groups.flatMap((g) => g.subRows)).find((x) => x.id === id);
let delTimer;
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const [act, a, b] = el.dataset.act.split(':');
  if (el.tagName === 'A') e.preventDefault();
  switch (act) {
    case 'month': ui.month = Math.max(0, Math.min(11, ui.month + Number(a))); break;
    case 'bucket': ui.bucket = Math.max(0, Math.min(RANGES[ui.range].buckets.length - 1, ui.bucket + Number(a))); break;
    case 'group': ui.open.has(a) ? ui.open.delete(a) : ui.open.add(a); if (ui.allOpen) { ui.allOpen = false; } break;
    case 'months': ui.months.has(a) ? ui.months.delete(a) : ui.months.add(a); break;
    case 'expandall': ui.allOpen = !ui.allOpen; if (!ui.allOpen) ui.open.clear(); break;
    case 'drill': ui.drill = a; ui.months.clear(); window.scrollTo(0, 0); break;
    case 'cleardrill': ui.drill = null; break;
    case 'retry': ui.error = false; ui.loading = false; break;
    case 'editbudget': { const s = subById(a); toast(`Opens the existing Edit budget sheet: ${s.name}, ${MONTH_FULL[+b]} ${ui.year}`); return; }
    case 'day': ui.sel = Number(a); break;
    case 'billrow': toast('Opens the existing recurring detail'); return;
    case 'select': ui.select = true; ui.ticked.clear(); break;
    case 'cancelselect': ui.select = false; ui.ticked.clear(); ui.confirmDel = false; break;
    case 'tick': { const id = Number(a); ui.ticked.has(id) ? ui.ticked.delete(id) : ui.ticked.add(id); ui.confirmDel = false; break; }
    case 'tickall': ui.ticked.size ? ui.ticked.clear() : TX_ALL.forEach((t) => ui.ticked.add(t.id)); break;
    case 'bulkedit': ui.sheet = 'edit'; ui.bulkSet = false; break;
    case 'bulkdelete':
      if (isPhone()) { ui.sheet = 'delete'; break; }
      if (!ui.confirmDel) { ui.confirmDel = true; clearTimeout(delTimer); delTimer = setTimeout(() => { ui.confirmDel = false; render(); }, 3000); break; }
    // falls through: second click on desktop confirms
    case 'confirmdelete': toast(`${ui.ticked.size} transactions deleted`); ui.ticked.clear(); ui.select = false; ui.sheet = null; ui.confirmDel = false; break;
    case 'apply': toast(`${ui.ticked.size} transactions updated`); ui.sheet = null; ui.ticked.clear(); ui.select = false; break;
    case 'closesheet': ui.sheet = null; break;
    case 'opentfa': ui.sheet = 'twofa'; ui.code = ''; ui.err = false; break;
    case 'qr': ui.qr = !ui.qr; break;
    case 'copykey': toast('Setup key copied'); return;
    case 'addapp': toast('Opens your authenticator app with Ledger filled in'); return;
    case 'verify': toast('Two-factor authentication is on'); ui.sheet = null; break;
    case 'choosefile': ui.step = 2; break;
    case 'importback': ui.step = 1; break;
    case 'importnext': toast('Goes to step 3, Review & categorize (#206)'); return;
    case 'sign': ui.sign = a; break;
    case 'openmerchant': ui.sheet = 'merchant'; break;
    case 'merge': toast('Opens Merge & delete: pick the merchant to keep'); return;
    case 'save': toast('Merchant saved'); ui.sheet = null; break;
    default: return;
  }
  const focusAct = el.dataset.act;
  render();
  const again = document.querySelector(`[data-act="${CSS.escape(focusAct)}"]`);
  if (again) again.focus({ preventScroll: true });
});
document.addEventListener('input', (e) => {
  const d = e.target.dataset || {};
  if (d.input === 'code') {
    const boxes = [...document.querySelectorAll('[data-input="code"]')];
    e.target.value = e.target.value.replace(/\D/g, '').slice(-1);
    ui.code = boxes.map((x) => x.value).join(''); ui.err = false;
    const i = Number(d.i);
    boxes.forEach((x) => x.classList.remove('err'));
    document.querySelector('[role="alert"]')?.remove();
    if (e.target.value && boxes[i + 1]) boxes[i + 1].focus();
    if (ui.code.length === 6) { if (ui.st.screen === 'authsetup') { toast('Signed in'); } else render(); }
  }
});
document.addEventListener('change', (e) => {
  if (e.target.dataset && e.target.dataset.input === 'bulk') { ui.bulkSet = [...document.querySelectorAll('[data-input="bulk"]')].some((s) => s.value); render(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (ui.sheet) { ui.sheet = null; render(); return; }
  if (ui.select && !isPhone()) { ui.select = false; ui.ticked.clear(); render(); }
});
matchMedia('(max-width: 767px)').addEventListener('change', () => { ui.scrollInit = true; render(); });

// ---------- boot ----------
const params = new URLSearchParams(location.search);
const startState = STATE_NAMES.includes(params.get('state')) ? params.get('state') : STATE_NAMES[0];
setTheme(THEMES.includes(params.get('theme')) ? params.get('theme') : 'light');
reset(startState);
renderBar();
render();
requestAnimationFrame(() => syncUrl());

</script>
</body>
</html>
